version: 2
# Atualizações de SEGURANÇA (vulnerabilidades) NÃO são tratadas aqui: o auto-PR de
# segurança do Dependabot está DESLIGADO (repo setting automated-security-fixes).
# Vulnerabilidade vira alerta → pipeline dependabot-to-jules → Jules conserta.
# Aqui ficam só as atualizações de versão de rotina (patch/minor).
updates:
  # Configuração de atualizações do ecossistema PNPM (monorepo)
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependabot"
      - "dependencies"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  # Configuração de atualizações do ecossistema GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependabot"
      - "github-actions"
