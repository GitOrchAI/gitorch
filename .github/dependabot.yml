version: 2
updates:
  # Configuração de atualizações do ecossistema NPM (monorepo pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "jules"
    reviewers:
      - "jules"
    labels:
      - "jules"
      - "dependencies"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"

  # Configuração de atualizações do ecossistema GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "jules"
    reviewers:
      - "jules"
    labels:
      - "jules"
      - "github-actions"
