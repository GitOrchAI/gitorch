version: 2
# Atualizações de SEGURANÇA (vulnerabilidades) NÃO são tratadas aqui: o auto-PR de
# segurança do Dependabot está DESLIGADO (repo setting automated-security-fixes).
# Vulnerabilidade vira alerta → pipeline dependabot-to-jules → Jules conserta.
# Aqui ficam só as atualizações de versão de rotina (patch/minor).
updates:
  # Ecossistema Node do monorepo. O valor VÁLIDO é "npm" — ele cobre npm, yarn E
  # pnpm (o Dependabot lê o pnpm-lock.yaml por baixo). "pnpm" NÃO é um
  # package-ecosystem aceito: o arquivo era rejeitado na validação
  # ("did not match one of the following values"), e o erro só aparecia quando
  # algo mexia no arquivo e forçava o re-parse.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependabot"
      - "dependencies"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
    # MAJOR não entra por auto-PR. O `groups` acima só AGRUPA patch/minor — uma
    # major continuava ganhando PR PRÓPRIO, e foi assim que o TypeScript 7 (o
    # compilador nativo) entrou sozinho em 23/07 e deixou a main VERMELHA para
    # todos os PRs abertos (o TS 7 removeu o subpath './bin/tsc', quebrando o
    # typecheck estrito do CI). Major é MIGRAÇÃO deliberada, com plano e teste —
    # não atualização de rotina. Isto alinha a config ao que o comentário do topo
    # deste arquivo já prometia: aqui só rotina (patch/minor).
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

