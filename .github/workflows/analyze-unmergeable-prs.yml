name: Analyze Unmergeable Jules PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to analyze (optional, leaves blank to scan all)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can checkout PR branches and merge them

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Conflict Analyzer
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            node .github/scripts/analyze-unmergeable.js ${{ github.event.pull_request.number }}
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr_number }}" ]; then
            node .github/scripts/analyze-unmergeable.js ${{ github.event.inputs.pr_number }}
          else
            node .github/scripts/analyze-unmergeable.js
          fi
