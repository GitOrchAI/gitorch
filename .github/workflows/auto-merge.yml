name: Auto-Merge PRs (Dependabot & Jules)

# Auto-merge ESTRITO: só PR desta automação de segurança — PR do Dependabot, ou PR do Jules
# que resolve uma issue com label 'dependabot'/'jules'. Qualquer outro PR NÃO entra.
# Mescla (squash) assim que o CI fica 100% verde. O CI é o porteiro (tolerância zero).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número do PR para avaliar (manual)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

# Nome do próprio check deste workflow — para excluí-lo da espera (senão dá deadlock).
env:
  SELF_CHECK_NAME: 'Enable Auto-Merge for Qualifying PRs'

jobs:
  auto-merge:
    name: Enable Auto-Merge for Qualifying PRs
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Auto-Merge Eligibility
        id: evaluate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber =
              context.payload.pull_request?.number ||
              context.payload.check_suite?.pull_requests?.[0]?.number ||
              context.payload.workflow_run?.pull_requests?.[0]?.number ||
              (context.payload.inputs?.pr_number ? parseInt(context.payload.inputs.pr_number, 10) : undefined);

            if (!prNumber) {
              console.log('Nenhum PR no payload.');
              core.setOutput('eligible', 'false');
              return;
            }

            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const prUser = pr.user.login;
            const prBody = pr.body || '';
            const prLabels = pr.labels.map(l => l.name);
            console.log(`PR #${prNumber}: user=${prUser}, state=${pr.state}, mergeable_state=${pr.mergeable_state}, labels=[${prLabels.join(', ')}]`);

            let eligible = false;
            let reason = '';

            if (pr.state !== 'open' || pr.mergeable_state === 'dirty') {
              reason = `PR não-mesclável (state=${pr.state}, mergeable_state=${pr.mergeable_state})`;
            } else if (prUser === 'dependabot[bot]') {
              eligible = true; reason = 'PR do Dependabot';
            } else if (prLabels.includes('jules') || prBody.includes('PR created automatically by Jules')) {
              eligible = true; reason = 'PR do Jules (label/marcador)';
            } else {
              // PR do Jules costuma sair como autor do usuário; qualificamos pela issue ligada
              // que tenha label 'dependabot' ou 'jules' (esta automação de segurança).
              const linked = [];
              const re = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
              let m;
              while ((m = re.exec(prBody)) !== null) linked.push(parseInt(m[1], 10));
              const urlRe = /https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/gi;
              while ((m = urlRe.exec(prBody)) !== null) linked.push(parseInt(m[1], 10));
              for (const n of linked) {
                try {
                  const issue = await github.rest.issues.get({ owner, repo, issue_number: n });
                  const labels = issue.data.labels.map(l => l.name);
                  if (labels.includes('dependabot') || labels.includes('jules')) {
                    eligible = true; reason = `PR resolve issue #${n} (label dependabot/jules)`; break;
                  }
                } catch (err) {
                  console.warn(`Não consegui checar issue #${n}: ${err.message}`);
                }
              }
            }

            console.log(eligible ? `✓ ELEGÍVEL: ${reason}` : `✗ NÃO elegível: ${reason || 'fora da automação de segurança'}`);
            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.setOutput('prNumber', String(prNumber));

      - name: Wait for CI and Merge
        if: steps.evaluate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.evaluate.outputs.prNumber }}
          REPO: ${{ github.repository }}
        run: |
          echo "Avaliando checks do PR #$PR_NUM (exclui o próprio '$SELF_CHECK_NAME')..."
          # Buckets do gh: pass | skipping | pending | fail | cancel
          for i in $(seq 1 30); do
            CHECKS=$(gh pr checks "$PR_NUM" --repo "$REPO" --json name,bucket 2>/dev/null || echo '[]')
            OTHERS=$(echo "$CHECKS" | jq --arg self "$SELF_CHECK_NAME" '[.[] | select(.name != $self)]')

            BLOCKING=$(echo "$OTHERS" | jq '[.[] | select(.bucket=="fail" or .bucket=="cancel")] | length')
            PENDING=$(echo "$OTHERS" | jq '[.[] | select(.bucket=="pending")] | length')
            TOTAL=$(echo "$OTHERS" | jq 'length')
            echo "[$i] checks (fora o próprio): total=$TOTAL pendentes=$PENDING bloqueando=$BLOCKING"

            if [ "$BLOCKING" -gt 0 ]; then
              echo "::error::CI vermelho no PR #$PR_NUM — auto-merge NÃO habilitado."
              echo "$OTHERS" | jq -r '.[] | select(.bucket=="fail" or .bucket=="cancel") | "  ✗ \(.name): \(.bucket)"'
              exit 1
            fi

            if [ "$PENDING" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "CI 100% verde no PR #$PR_NUM. Mesclando..."
              gh pr review "$PR_NUM" --approve \
                --body "Aprovado automaticamente pelo pipeline de segurança (Dependabot/Jules)." \
                --repo "$REPO" || true
              for t in 1 2 3; do
                if gh pr merge "$PR_NUM" --squash --repo "$REPO"; then
                  echo "PR #$PR_NUM mesclado."
                  exit 0
                fi
                echo "Tentativa de merge $t falhou, repetindo em 10s..."
                sleep 10
              done
              echo "::error::Falha ao mesclar o PR #$PR_NUM após 3 tentativas."
              exit 1
            fi

            sleep 30
          done
          echo "::error::Timeout aguardando CI do PR #$PR_NUM."
          exit 1
