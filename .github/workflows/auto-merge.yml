name: Auto-Merge PRs (Dependabot & Jules)

# Auto-merge ESTRITO: só PR desta automação de segurança — PR do Dependabot, ou PR do Jules
# que resolve uma issue com label 'dependabot'/'jules'. Qualquer outro PR NÃO entra.
# Mescla (squash) quando o CI fica 100% verde E o QA autoriza.
#
# São dois porteiros, não um. O CI diz se o código roda; o QA diz se o código
# resolve o que a issue pediu. Já aconteceu de um pull request reprovado pelo QA
# entrar na linha principal um minuto depois da reprovação, porque a mesclagem
# olhava só os testes — o julgamento existia e não valia nada.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  # Sem isto o laço não fecha: o veredito do QA chega como revisão, e revisão não
  # dispara nenhum dos outros eventos. O PR aprovado ficaria esperando para
  # sempre alguém enviar um commit novo só para acordar a automação.
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Número do PR para avaliar (manual)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

# Um pull request de cada vez. Sem isto, um commit novo e uma revisão chegando
# quase juntos abrem duas execuções que esperam o mesmo CI e correm para mesclar
# o mesmo PR. Enfileirar, nunca cancelar: cancelar no meio da mesclagem deixaria
# o pull request num estado que ninguém pediu.
concurrency:
  group: >-
    auto-merge-${{ github.event.pull_request.number
    || github.event.check_suite.pull_requests[0].number
    || github.event.inputs.pr_number
    || github.run_id }}
  cancel-in-progress: false

# Nome do próprio check deste workflow — para excluí-lo da espera (senão dá deadlock).
env:
  SELF_CHECK_NAME: 'Enable Auto-Merge for Qualifying PRs'

jobs:
  auto-merge:
    name: Enable Auto-Merge for Qualifying PRs
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Auto-Merge Eligibility
        id: evaluate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECURITY_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber =
              context.payload.pull_request?.number ||
              context.payload.check_suite?.pull_requests?.[0]?.number ||
              context.payload.workflow_run?.pull_requests?.[0]?.number ||
              (context.payload.inputs?.pr_number ? parseInt(context.payload.inputs.pr_number, 10) : undefined);

            if (!prNumber) {
              console.log('Nenhum PR no payload.');
              core.setOutput('eligible', 'false');
              return;
            }

            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const prUser = pr.user.login;
            const prBody = pr.body || '';
            const prLabels = pr.labels.map(l => l.name);
            console.log(`PR #${prNumber}: user=${prUser}, state=${pr.state}, mergeable_state=${pr.mergeable_state}, labels=[${prLabels.join(', ')}]`);

            let eligible = false;
            let reason = '';

            if (pr.state !== 'open' || pr.mergeable_state === 'dirty') {
              reason = `PR não-mesclável (state=${pr.state}, mergeable_state=${pr.mergeable_state})`;
            } else if (prUser === 'dependabot[bot]') {
              eligible = true; reason = 'PR do Dependabot';
            } else if (prLabels.includes('jules') || prBody.includes('PR created automatically by Jules')) {
              eligible = true; reason = 'PR do Jules (label/marcador)';
            } else {
              // PR do Jules costuma sair como autor do usuário; qualificamos pela issue ligada
              // que tenha label 'dependabot' ou 'jules' (esta automação de segurança).
              const linked = [];
              const re = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
              let m;
              while ((m = re.exec(prBody)) !== null) linked.push(parseInt(m[1], 10));
              const urlRe = /https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/gi;
              while ((m = urlRe.exec(prBody)) !== null) linked.push(parseInt(m[1], 10));
              for (const n of linked) {
                try {
                  const issue = await github.rest.issues.get({ owner, repo, issue_number: n });
                  const labels = issue.data.labels.map(l => l.name);
                  if (labels.includes('dependabot') || labels.includes('jules')) {
                    eligible = true; reason = `PR resolve issue #${n} (label dependabot/jules)`; break;
                  }
                } catch (err) {
                  console.warn(`Não consegui checar issue #${n}: ${err.message}`);
                }
              }
            }

            console.log(eligible ? `✓ ELEGÍVEL: ${reason}` : `✗ NÃO elegível: ${reason || 'fora da automação de segurança'}`);
            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.setOutput('prNumber', String(prNumber));

      # O código do repositório BASE, nunca o do pull request: este trabalho roda
      # com permissão de escrita e acesso a segredos, e executar código vindo de
      # fora com esse token seria entregar a chave.
      #
      # O `ref` é explícito de propósito. Confiar no padrão só seria seguro se o
      # trabalho tivesse um gatilho só; aqui são quatro, cada um com uma noção
      # própria do que é "a referência atual", e um deles bastaria para trazer o
      # código do pull request para dentro do passo privilegiado. Nomear a base
      # custa uma linha e não depende de lembrar essa tabela.
      #
      # `persist-credentials: false` porque nenhum passo daqui para baixo usa git
      # autenticado — o que a mesclagem precisa vem por `gh`, com o token no
      # ambiente do passo, e não pela credencial que o checkout deixaria gravada.
      - name: Checkout Base Repository
        if: steps.evaluate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node
        if: steps.evaluate.outputs.eligible == 'true'
        uses: ./.github/actions/setup-pnpm

      # `npm ci` e não `install`: instala exatamente o que está no lockfile
      # versionado. Este passo roda com token de escrita e acesso a secrets, então
      # resolver dependência do registry na hora — sem pin — seria deixar a porta
      # aberta para qualquer versão publicada depois desta revisão.
      - name: Install Script Dependencies
        if: steps.evaluate.outputs.eligible == 'true'
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile

      - name: QA Verdict Gate
        id: gate
        if: steps.evaluate.outputs.eligible == 'true'
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.evaluate.outputs.prNumber }}
          QA_REVIEWER: ${{ vars.GITORCH_QA_REVIEWER }}
        run: npx tsx check-merge-gate.ts

      - name: Wait for CI and Merge
        if: steps.evaluate.outputs.eligible == 'true' && steps.gate.outputs.pode == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          PR_NUM: ${{ steps.evaluate.outputs.prNumber }}
          REPO: ${{ github.repository }}
          # A reconferência de última hora faz a mesma pergunta ao portão, logo
          # antes de mesclar; por isso repete o ambiente do passo anterior.
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ steps.evaluate.outputs.prNumber }}
          QA_REVIEWER: ${{ vars.GITORCH_QA_REVIEWER }}
        run: |
          echo "Avaliando checks do PR #$PR_NUM (exclui o próprio '$SELF_CHECK_NAME')..."
          # Buckets do gh: pass | skipping | pending | fail | cancel
          for i in $(seq 1 30); do
            CHECKS=$(gh pr checks "$PR_NUM" --repo "$REPO" --json name,bucket 2>/dev/null || true)
            if [ "$(echo "$CHECKS" | jq -r 'type' 2>/dev/null)" != "array" ]; then
              CHECKS="[]"
            fi
            OTHERS=$(echo "$CHECKS" | jq --arg self "$SELF_CHECK_NAME" '[.[] | select(.name != $self)]')

            BLOCKING=$(echo "$OTHERS" | jq '[.[] | select(.bucket=="fail" or .bucket=="cancel")] | length')
            PENDING=$(echo "$OTHERS" | jq '[.[] | select(.bucket=="pending")] | length')
            TOTAL=$(echo "$OTHERS" | jq 'length')
            echo "[$i] checks (fora o próprio): total=$TOTAL pendentes=$PENDING bloqueando=$BLOCKING"

            if [ "$BLOCKING" -gt 0 ]; then
              echo "::notice::CI vermelho no PR #$PR_NUM — auto-merge NÃO habilitado."
              echo "$OTHERS" | jq -r '.[] | select(.bucket=="fail" or .bucket=="cancel") | "  ✗ \(.name): \(.bucket)"' || true
              exit 0
            fi

            if [ "$PENDING" -eq 0 ] && [ "$TOTAL" -gt 0 ]; then
              echo "CI 100% verde no PR #$PR_NUM. Reconferindo o veredito do QA..."

              # A consulta lá de cima é de minutos atrás. Nesse meio-tempo o dev
              # assíncrono pode ter enviado um commit novo — é literalmente o que
              # a automação de CI vermelho manda ele fazer — ou o QA pode ter
              # reprovado. Mesclar com base naquela resposta antiga entregaria à
              # linha principal um código que ninguém julgou: o mesmo defeito que
              # este portão existe para fechar, só que pela porta dos fundos.
              # O portão relê o topo do PR agora, e `--exigir` faz a negativa
              # abortar em vez de virar aviso.
              if ! ( cd .github/scripts && npx tsx check-merge-gate.ts --exigir ); then
                echo "::notice::O veredito do QA mudou durante a espera pelo CI — merge do PR #$PR_NUM cancelado."
                exit 0
              fi

              # A versão que acabou de ser aprovada. A mesclagem se prende a ela:
              # reconferir e depois mesclar "o topo, seja ele qual for" deixaria
              # de fora justamente o instante entre uma coisa e outra.
              SHA_JULGADO=$(cat .github/scripts/.sha-reconferido)
              echo "Veredito reconfirmado para ${SHA_JULGADO:0:7}. Mesclando..."
              # Formalidade para a plataforma liberar a mesclagem. A aprovação de
              # mérito é a do QA, verificada no passo anterior — esta aqui não
              # substitui nem dispensa aquela.
              gh pr review "$PR_NUM" --approve \
                --body "Mesclagem liberada: CI verde e veredito do QA favorável." \
                --repo "$REPO" || true
              # `--match-head-commit` faz a plataforma recusar a mesclagem se o
              # topo tiver mudado. É o que transforma a reconferência em garantia:
              # sem ele, as três tentativas com dez segundos de intervalo seriam
              # três janelas para um commit novo entrar carregado por um veredito
              # que não era sobre ele.
              for t in 1 2 3; do
                if gh pr merge "$PR_NUM" --squash --repo "$REPO" \
                     --match-head-commit "$SHA_JULGADO"; then
                  echo "PR #$PR_NUM mesclado na versão ${SHA_JULGADO:0:7}."
                  exit 0
                fi
                echo "Tentativa de merge $t falhou, repetindo em 10s..."
                sleep 10
              done
              echo "::error::Falha ao mesclar o PR #$PR_NUM após 3 tentativas."
              exit 1
            fi

            sleep 30
          done
          echo "::notice::Timeout aguardando CI do PR #$PR_NUM."
          exit 0

      - name: Explain Retained Merge
        if: steps.evaluate.outputs.eligible == 'true' && steps.gate.outputs.pode != 'true'
        # O motivo entra por variável de ambiente, nunca interpolado direto no
        # shell. Hoje ele só carrega texto fixo e identificadores de commit, mas
        # o passo existe para explicar — e explicação tende a citar o que veio de
        # fora. Interpolar aqui seria dar ao texto de terceiros um comando de
        # shell com token de escrita na mão.
        env:
          MOTIVO: ${{ steps.gate.outputs.motivo }}
        run: |
          {
            echo "### Merge automático retido"
            echo ""
            echo "$MOTIVO"
          } >> "$GITHUB_STEP_SUMMARY"
