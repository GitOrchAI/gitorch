name: Auto-Merge PRs (Dependabot & Jules)

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # Executa se o PR foi criado pelo Dependabot, pelo Jules ou se tem a label 'jules'
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'google-labs-jules[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'jules')
    steps:
      - name: Aprovar e Ativar Auto-Merge
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
