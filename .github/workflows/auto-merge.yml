name: Auto-Merge PRs (Dependabot & Jules)

# PR qualificada (Dependabot ou Jules) com CI 100% verde → aprova e habilita auto-merge (squash).
# Sempre — política de tolerância zero: o CI é o porteiro.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: read
  checks: read

jobs:
  auto-merge:
    name: Enable Auto-Merge for Qualifying PRs
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Auto-Merge Eligibility
        id: evaluate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber =
              context.payload.pull_request?.number ||
              context.payload.check_suite?.pull_requests?.[0]?.number;

            if (!prNumber) {
              console.log("Nenhum PR no payload.");
              core.setOutput('eligible', 'false');
              return;
            }

            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data;
            const prUser = pr.user.login;
            const prBody = pr.body || '';
            const prLabels = pr.labels.map(l => l.name);
            console.log(`PR #${prNumber}: user=${prUser}, state=${pr.state}, mergeable_state=${pr.mergeable_state}, labels=[${prLabels.join(', ')}]`);

            let eligible = false;
            let reason = '';

            if (pr.state !== 'open' || pr.mergeable_state === 'dirty') {
              reason = `PR não-mesclável (state=${pr.state}, mergeable_state=${pr.mergeable_state})`;
            } else if (prUser === 'dependabot[bot]') {
              eligible = true; reason = 'PR do Dependabot';
            } else if (prLabels.includes('jules') || prBody.includes('PR created automatically by Jules')) {
              eligible = true; reason = "PR do Jules (resolve issue 'jules')";
            } else {
              const linked = [];
              const re = /(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
              let m;
              while ((m = re.exec(prBody)) !== null) linked.push(parseInt(m[1], 10));
              const urlRe = /https:\/\/github\.com\/[^/]+\/[^/]+\/issues\/(\d+)/gi;
              while ((m = urlRe.exec(prBody)) !== null) linked.push(parseInt(m[1], 10));
              for (const n of linked) {
                try {
                  const issue = await github.rest.issues.get({ owner, repo, issue_number: n });
                  const labels = issue.data.labels.map(l => l.name);
                  if (labels.includes('dependabot') || labels.includes('jules')) {
                    eligible = true; reason = `PR resolve issue #${n} (label dependabot/jules)`; break;
                  }
                } catch (err) {
                  console.warn(`Não consegui checar issue #${n}: ${err.message}`);
                }
              }
            }

            console.log(eligible ? `✓ ELEGÍVEL: ${reason}` : `✗ NÃO elegível: ${reason || 'não casa critérios'}`);
            core.setOutput('eligible', eligible ? 'true' : 'false');
            core.setOutput('prNumber', String(prNumber));

      - name: Wait for CI to Pass
        if: steps.evaluate.outputs.eligible == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = parseInt('${{ steps.evaluate.outputs.prNumber }}', 10);
            console.log(`Aguardando CI 100% verde no PR #${prNumber}...`);

            const maxWaitMs = 15 * 60 * 1000;
            const start = Date.now();
            const interval = 30000;

            while (Date.now() - start < maxWaitMs) {
              const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
              const suites = await github.rest.checks.listSuitesForRef({
                owner, repo, ref: pr.data.head.sha, per_page: 20
              });
              const relevant = suites.data.check_suites.filter(s => s.workflow_id);

              if (relevant.length > 0) {
                const allCompleted = relevant.every(s => s.status === 'completed');
                const allSuccess = relevant.every(s => s.conclusion === 'success');
                if (allCompleted && allSuccess) { console.log('CI 100% verde.'); return; }
                if (allCompleted && !allSuccess) {
                  core.setFailed(`CI falhou no PR #${prNumber}. Auto-merge não habilitado.`);
                  return;
                }
                console.log(`CI rodando... (${relevant.filter(s => s.status === 'completed').length}/${relevant.length} concluídos)`);
              } else {
                console.log('Nenhum check suite ainda...');
              }
              await new Promise(r => setTimeout(r, interval));
            }
            core.setFailed('Timeout aguardando CI. Auto-merge não habilitado.');

      - name: Enable Auto-Merge
        if: steps.evaluate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.evaluate.outputs.prNumber }}
        run: |
          echo "Habilitando auto-merge no PR #$PR_NUM..."
          gh pr review "$PR_NUM" --approve \
            --body "Aprovado automaticamente pelo pipeline de segurança (Dependabot/Jules)." \
            --repo "${{ github.repository }}" || true
          for i in 1 2 3; do
            if gh pr merge "$PR_NUM" --auto --squash --repo "${{ github.repository }}"; then
              echo "Auto-merge habilitado para o PR #$PR_NUM"
              exit 0
            fi
            echo "Tentativa $i falhou, repetindo em 5s..."
            sleep 5
          done
          echo "Falha ao habilitar auto-merge após 3 tentativas"
          exit 1
