# Trigger CI rebuild
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  zero-tolerance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitorch_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # apps/control-plane/test/db-migrate.integration.test.ts (F2.1.6) usa
      # isto como conexão-admin pra criar/derrubar bancos descartáveis de
      # cada teste (gitorch_it_*) contra o Postgres deste próprio serviço.
      # Nome DIFERENTE de DATABASE_URL de propósito: src/test/setup.ts
      # sobrescreve DATABASE_URL globalmente com um placeholder falso antes
      # da suíte padrão rodar. Sem esta var o teste se auto-pula (skip) em
      # vez de falhar — mas então nunca prova nada em nenhum PR. O banco
      # gitorch_ci provisionado acima não é usado por nenhum outro passo
      # deste job, então reusá-lo como conexão-admin não arrisca interferir
      # com mais nada.
      GITORCH_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitorch_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # scripts/ci guarda os proprios portoes do pipeline (o gate de tipos
      # estrito, o audit de impacto, o scan de segredo etc.) e tem testes
      # (scripts/ci/*.test.ts) pra cada um deles — mas a raiz do monorepo nao
      # e um workspace do pnpm (ver pnpm-workspace.yaml), entao `pnpm run
      # test` (turbo run test, alguns passos abaixo) nunca alcancava esses
      # arquivos: eles existiam e nunca rodavam. Uma regressao num desses
      # scripts passaria verde pelo resto do CI, e o proprio gate que existe
      # pra pegar regressao viraria enfeite — exatamente o que aconteceu com
      # o gate de tipos estrito antes de ser corrigido. Roda cedo, antes de
      # qualquer passo abaixo usar esses scripts pra decidir algo.
      - name: Testes dos scripts que governam o CI (fora dos workspaces)
        run: pnpm run test:scripts
      - name: Verify CI baseline
        run: pnpm exec tsx scripts/ci/verify-ci-baseline.ts
      - name: Validate workflow YAML (sem chaves duplicadas)
        run: pnpm exec tsx scripts/ci/validate-workflows.ts
      - name: Strict TypeScript check
        run: pnpm run typecheck:strict
      - name: Restrictive lint
        run: pnpm run lint:ci
      - name: SCIP and CGC graph audit
        run: pnpm run audit:cgc
      - name: README-to-Code parity
        run: pnpm run audit:readme-parity
      - name: Graph-aware impact radius
        id: impact
        run: |
          base="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          changed=$(git diff --name-only "origin/$base"...HEAD)
          pnpm exec tsx scripts/ci/impact-radius.ts "$changed"
      - name: Validate database schema
        run: pnpm --filter @gitorch/control-plane exec prisma generate
      - name: Build packages
        run: pnpm run build
      - name: Impacted tests
        run: |
          filters=$(cat ci/audit/impact-radius.json | jq -r '.packages[]' 2>/dev/null | sed 's/^/--filter /' || true)
          if [ -z "$filters" ]; then
            pnpm run test
          else
            pnpm exec turbo run test $filters
          fi
      - name: Secret scan
        env:
          # A ferramenta gitleaks (MIT) roda sem chave nenhuma. Quem exige
          # cadastro para conta de organizacao e a Action que a embrulha —
          # e este repositorio passou a pertencer a uma organizacao, o que
          # deixou o scan vermelho em TODO PR e na propria main. Instalar o
          # binario oficial mantem exatamente a mesma varredura, sem depender
          # de segredo de terceiro. Versao pinada: build reproduzivel.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          gitleaks detect --source . --redact --exit-code 1 \
            --report-format sarif --report-path results.sarif
      - name: Write pheromone secret-scan marker
        run: pnpm run audit:secrets
      # Antes só existia o placeholder repo-smoke.spec.ts (não usa fixture de
      # navegador, nunca precisou de Chromium). O 1º spec real (E2E do
      # setup wizard) expôs que este job nunca instalava o browser.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Headless Playwright E2E
        run: pnpm run e2e
      - name: Audit summary gate
        run: pnpm exec tsx scripts/ci/audit-summary.ts
      - name: Upload CI audit
        if: always()
        uses: ./.github/actions/upload-ci-audit

  # F1 Onda 4 ("Prova"): o funil INTEIRO do setup wizard (login, termos,
  # repo, clone, diagnóstico+grafo 3D, os 3 motores, telegram, plano, submit,
  # status final) navegado de verdade no navegador, em TODO PR — não só
  # depois do merge. Existe pra matar "disseram pronto sem prova".
  #
  # Roda com GITORCH_FAKE_ENGINES=1 (services/fake-engines.ts): login
  # assistido e liveness dos 3 motores são fakes determinísticos, sem
  # podman/imagem de agente/CLI real. NÃO precisa de nenhum secret (a fixture
  # gitorch-e2e-fixture é pública — clone anônimo — e a listagem de repos do
  # GitHub é interceptada no navegador, tests/e2e/setup-wizard-funil-completo-
  # fake.spec.ts) — de propósito: um job que se auto-pula por falta de
  # secret não prova nada, e este é o único ponto da Onda 4 que existe
  # exatamente pra nunca deixar isso acontecer de novo. Job separado do
  # zero-tolerance (infra própria: banco/redis efêmeros + control-plane real)
  # e do e2e-wizard.yml (que continua só pós-merge, com credencial real de
  # GitHub e sujeito a rate-limit da API deles — o oposto do que este job
  # busca).
  e2e-funil-fake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitorch_e2e_funil_fake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gitorch_e2e_funil_fake
      REDIS_URL: redis://localhost:6379/0
      PORT: 4012
      HOST: 127.0.0.1
      FRONTEND_URL: http://127.0.0.1:4012
      CORS_ORIGIN: http://127.0.0.1:4012
      GITORCH_EXECUTOR: local-process
      E2E_BASE_URL: http://127.0.0.1:4012
      # O CORAÇÃO deste job: fakes determinísticos no boot (services/fake-
      # engines.ts) — sem eles o passo 7 tentaria abrir um container podman
      # de verdade e o job travaria/falharia por falta de imagem de agente.
      GITORCH_FAKE_ENGINES: '1'
      # O par do anterior, para o ÚNICO ponto em que o wizard fala de verdade
      # com o GitHub: a prova de que o cliente pode ESCREVER no repositório
      # declarado. Este E2E "conecta" o GitHub com um token FAKE, então a
      # prova recebe 401 do GitHub real e o passo final do funil é recusado —
      # corretamente, do ponto de vista da guarda.
      #
      # A guarda NÃO é afrouxada: ela continua fazendo a mesma pergunta, com a
      # mesma régua, em qualquer ambiente. O que muda é só o fio que ela usa
      # para perguntar, e só com os DOIS cadeados abertos (esta flag explícita
      # E NODE_ENV diferente de produção). Flag própria de propósito: ligar os
      # motores fake não pode, de brinde, desligar a prova de posse do
      # repositório — ver services/fake-github-access.ts.
      GITORCH_FAKE_GITHUB_ACCESS: '1'
      # O scheduler processa clone_and_start_engines a cada tick (default
      # 60s) — rápido demais pra esperar num job de PR. 2s é suficiente pra
      # missão (clone da fixture pública, minúscula) processar em segundos.
      GITORCH_SCHEDULER_TICK_MS: '2000'
      # Achado real (ver commit do spec): o funil INTEIRO comprimido pelos
      # fakes em ~20s facilmente passa das 20 requisições autenticadas/min
      # que auth.ts aplica contra brute-force — teto correto pra uma sessão
      # HUMANA (minutos), apertado demais pra este teste. Só este job eleva;
      # produção continua em 20.
      GITORCH_AUTH_RATE_LIMIT_MAX: '2000'
      RATE_LIMIT_MAX: '2000'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GITORCH_CREDENTIAL_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GITHUB_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply schema (db push, banco efêmero do CI)
        working-directory: apps/control-plane
        run: npx prisma db push --skip-generate
      - name: Prisma generate
        working-directory: apps/control-plane
        run: npx prisma generate
      - name: Seed plans
        working-directory: apps/control-plane
        run: npx tsx prisma/seed.ts

      - name: Build web (export estático)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4012
      - name: Build control-plane + deps
        run: npx turbo run build --filter=@gitorch/control-plane...

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start control-plane
        working-directory: apps/control-plane
        env:
          NODE_ENV: development
          GITORCH_WORKSPACES_DIR: ${{ runner.temp }}/gitorch-workspaces
          GITORCH_CORTEX_DB: ${{ runner.temp }}/gitorch-cortex.sqlite
          GITORCH_ENVIRONMENTS_DIR: ${{ runner.temp }}/gitorch-environments
        run: nohup node dist/index.js > /tmp/control-plane.log 2>&1 &
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4012/health > /dev/null; then
              echo "control-plane healthy"; exit 0
            fi
            sleep 1
          done
          echo "control-plane never became healthy"; cat /tmp/control-plane.log; exit 1

      - name: "Run E2E (funil completo do setup wizard, motores fake)"
        run: |
          npx playwright test --workers=1 \
            tests/e2e/setup-wizard-funil-completo-fake.spec.ts

      - name: Server logs (on failure)
        if: failure()
        run: cat /tmp/control-plane.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-funil-fake
          path: playwright-report/
          retention-days: 7

  # Os scripts que governam as automações do repositório — entre eles o portão
  # que decide se um pull request pode ser mesclado — moram em .github/scripts,
  # que fica fora dos workspaces do pnpm. Nenhum job alcançava esse diretório:
  # os testes existiam e nunca rodavam. Uma regressão no portão passaria verde
  # por todo o CI, e a proteção viraria enfeite exatamente como já aconteceu.
  # Job próprio porque não depende de banco nem de navegador — leva segundos.
  scripts-de-automacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm
      - name: Install dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Typecheck
        working-directory: .github/scripts
        run: pnpm run typecheck
      - name: Test
        working-directory: .github/scripts
        run: pnpm test
