name: Code Scanning → Jules

# Fase 2: alertas do Code Scanning (CodeQL) → IA (rota free) monta prompt rico → cria issue →
# espera 10s → adiciona label 'jules'. Mesmo motor do dependabot-to-jules, fonte diferente.

on:
  schedule:
    - cron: '30 * * * *' # de hora em hora (defasado 30min do dependabot-to-jules)
  workflow_dispatch:
    inputs:
      alert_numbers:
        description: 'Números de alerta CodeQL separados por vírgula (vazio = todos os abertos)'
        required: false
        type: string

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: code-scanning-to-jules
  cancel-in-progress: false

jobs:
  create-jules-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT || github.token }}

      - name: Setup Node (pnpm)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Determine Alerts to Process
        id: alerts
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
        run: |
          if [ -n "${{ github.event.inputs.alert_numbers }}" ]; then
            ALERTS_JSON="[${{ github.event.inputs.alert_numbers }}]"
          else
            echo "Buscando todos os alertas de code scanning abertos..."
            RAW_OUTPUT=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/code-scanning/alerts?state=open&per_page=100" 2>/dev/null || true)
            if [ "$(echo "$RAW_OUTPUT" | jq -r 'type' 2>/dev/null)" != "array" ]; then
              echo "::warning::Retorno da API não é um array (pode ser erro 404/403). Retornando array vazio."
              ALERTS_JSON="[]"
            else
              ALERT_NUMS=$(echo "$RAW_OUTPUT" | jq '.[].number' | tr '\n' ',' | sed 's/,$//')
              if [ -n "$ALERT_NUMS" ]; then ALERTS_JSON="[$ALERT_NUMS]"; else ALERTS_JSON="[]"; fi
            fi
          fi
          echo "alerts=$ALERTS_JSON" >> "$GITHUB_OUTPUT"
          echo "Alertas a processar: $ALERTS_JSON"

      - name: Process Each Alert
        if: steps.alerts.outputs.alerts != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          LABEL_DELAY_MS: '10000'
          ISSUE_CREATION_DELAY_MS: '300000'
        working-directory: .github/scripts
        run: |
          ALERTS=$(echo '${{ steps.alerts.outputs.alerts }}' | jq -c '.')
          COUNT=$(echo "$ALERTS" | jq 'length')
          echo "Processando $COUNT alerta(s)..."

          for i in $(seq 0 $((COUNT - 1))); do
            ALERT_NUM=$(echo "$ALERTS" | jq -r ".[$i]")
            echo "==== CodeQL alerta #$ALERT_NUM ($((i+1))/$COUNT) ===="

            # Dedup: já existe issue para este alerta CodeQL?
            RAW_EXISTING=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues?state=all&per_page=100&labels=jules" 2>/dev/null || true)
            if [ "$(echo "$RAW_EXISTING" | jq -r 'type' 2>/dev/null)" != "array" ]; then
              echo "::warning::Retorno de issues não é um array (pode ser erro 404/403). Assumindo que não existe issue."
              EXISTING=""
            else
              EXISTING=$(echo "$RAW_EXISTING" | jq ".[] | select(.body | contains(\"codeql-alert-number: $ALERT_NUM\")) | .number" 2>/dev/null || echo "")
            fi

            if [ -n "$EXISTING" ]; then
              echo "Já existe issue #$EXISTING para o alerta CodeQL #$ALERT_NUM. Pulando."
            else
              echo "Gerando prompt (rota free)..."
              PROMPT_OUTPUT="$(npx tsx generate-codeql-prompt.ts "$ALERT_NUM" 2>&1)" || {
                echo "::error::Falha ao gerar prompt para o alerta CodeQL #$ALERT_NUM"
                echo "$PROMPT_OUTPUT"
                exit 1
              }

              PROMPT_JSON=$(echo "$PROMPT_OUTPUT" | sed -n '/=== GENERATED PROMPT ===/,/=== END PROMPT ===/p' | sed '1d;$d')
              if [ -z "$PROMPT_JSON" ] || ! echo "$PROMPT_JSON" | jq empty 2>/dev/null; then
                PROMPT_JSON=$(echo "$PROMPT_OUTPUT" | grep -E '^\s*\{' | tail -1)
              fi

              TITLE=$(echo "$PROMPT_JSON" | jq -r '.title')
              BODY=$(echo "$PROMPT_JSON" | jq -r '.body')
              LABELS=$(echo "$PROMPT_JSON" | jq -r '.labels | join(",")')

              REQUEST_FILE=$(mktemp)
              jq -n \
                --arg title "$TITLE" \
                --arg body "$BODY" \
                --argjson labels "$(echo "$LABELS" | jq -R 'split(",")')" \
                '{title: $title, body: $body, labels: $labels}' > "$REQUEST_FILE"
              RAW_ISSUE_OUTPUT=$(gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/issues" \
                --input "$REQUEST_FILE" 2>/dev/null || true)
              rm -f "$REQUEST_FILE"
              if [ "$(echo "$RAW_ISSUE_OUTPUT" | jq -r 'type' 2>/dev/null)" != "object" ]; then
                echo "::error::Retorno de criação de issue não é um objeto JSON. Falha ao criar issue para o alerta CodeQL #$ALERT_NUM"
                echo "$RAW_ISSUE_OUTPUT"
                exit 1
              fi
              ISSUE_NUM=$(echo "$RAW_ISSUE_OUTPUT" | jq -r '.number // empty')

              if [ -z "$ISSUE_NUM" ]; then
                echo "::error::Falha ao criar issue para o alerta CodeQL #$ALERT_NUM"
                echo "$RAW_ISSUE_OUTPUT"
                exit 1
              fi
              echo "Criada issue #$ISSUE_NUM"

              sleep $((LABEL_DELAY_MS / 1000))
              LABEL_FILE=$(mktemp)
              jq -n '{labels: ["jules"]}' > "$LABEL_FILE"
              gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/issues/$ISSUE_NUM/labels" \
                --input "$LABEL_FILE" 2>/dev/null || true
              rm -f "$LABEL_FILE"
              echo "Label 'jules' adicionada à issue #$ISSUE_NUM"
            fi

            if [ $i -lt $((COUNT - 1)) ]; then
              echo "Aguardando ${ISSUE_CREATION_DELAY_MS}ms antes do próximo alerta..."
              sleep $((ISSUE_CREATION_DELAY_MS / 1000))
            fi
          done
