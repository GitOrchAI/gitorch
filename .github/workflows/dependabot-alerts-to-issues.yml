name: Dependabot Alerts to Jules Issues

on:
  schedule:
    - cron: '0 * * * *' # Executa de hora em hora
  workflow_dispatch: # Permite execução manual sob demanda

permissions:
  security-events: read
  issues: write

jobs:
  sync-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar Alertas com Issues do Jules
        uses: actions/github-script@v7
        with:
          script: |
            // 1. Listar alertas abertos do Dependabot
            const alertsResponse = await github.rest.dependabot.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const alerts = alertsResponse.data;
            console.log(`Encontrados ${alerts.length} alertas abertos do Dependabot.`);

            // 2. Listar issues abertas com a label 'jules'
            const issuesResponse = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'jules'
            });
            const openIssues = issuesResponse.data;

            // 3. Processar cada alerta e criar issue se não existir
            for (const alert of alerts) {
              const alertNumber = alert.number;
              const packageName = alert.dependency.package.name;
              const severity = alert.security_advisory.severity;
              const summary = alert.security_advisory.summary;
              const ghsaId = alert.security_advisory.ghsa_id;
              const cveId = alert.security_advisory.cve_id || 'N/A';
              
              const marker = `<!-- dependabot-alert-number: ${alertNumber} -->`;
              const alreadyExists = openIssues.some(issue => issue.body && issue.body.includes(marker));
              
              if (alreadyExists) {
                console.log(`Issue para o alerta #${alertNumber} (${packageName}) já existe. Pulando.`);
                continue;
              }
              
              const title = `[Dependabot Alert] ${severity.toUpperCase()}: Vulnerabilidade no pacote ${packageName}`;
              const body = `### Detalhes do Alerta de Segurança
- **Pacote:** \`${packageName}\`
- **Ecossistema:** \`${alert.dependency.package.ecosystem}\`
- **Severidade:** \`${severity.toUpperCase()}\`
- **Advisory ID:** \`${ghsaId}\`
- **CVE:** \`${cveId}\`

### Descrição
${summary}

${alert.security_advisory.description || ''}

---
${marker}`;

              console.log(`Criando issue para o alerta #${alertNumber}...`);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['jules']
              });
            }
