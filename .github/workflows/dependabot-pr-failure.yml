name: Dependabot PR Failure Fallback

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  pull-requests: write
  issues: write
  actions: read
  contents: read

jobs:
  on-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Process Failed PR
        uses: actions/github-script@v7
        id: process-pr
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            console.log(`Workflow Run #${run.id} failed. Analyzing associated PRs...`);

            let prs = run.pull_requests;
            if (!prs || prs.length === 0) {
              console.log(`No PRs listed in workflow_run payload. Searching by head SHA: ${run.head_sha}`);
              const prList = await github.rest.pulls.list({
                owner,
                repo,
                state: 'open'
              });
              prs = prList.data.filter(pr => pr.head.sha === run.head_sha);
            }

            if (!prs || prs.length === 0) {
              console.log("No open PR associated with this run.");
              return { prs: [] };
            }

            const dependabotPrs = [];
            for (const prRef of prs) {
              console.log(`Fetching details for PR #${prRef.number}...`);
              const prResponse = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prRef.number
              });
              const pr = prResponse.data;

              const prUser = pr.user.login;
              const hasDependabotLabel = pr.labels.some(l => l.name.toLowerCase() === 'dependabot');

              console.log(`PR #${pr.number} created by '${prUser}' with labels: ${pr.labels.map(l => l.name).join(', ')}`);

              if (prUser === 'dependabot[bot]' || hasDependabotLabel) {
                console.log(`Processing failed Dependabot PR: #${pr.number}`);
                dependabotPrs.push(pr);
              } else {
                console.log(`PR #${pr.number} is not a Dependabot PR. Skipping.`);
              }
            }

            return { prs: dependabotPrs, runId: run.id, runUrl: `https://github.com/${owner}/${repo}/actions/runs/${run.id}` };

      - name: Detect Merge Conflicts
        id: detect-conflicts
        if: steps.process-pr.outputs.prs != '[]' && steps.process-pr.outputs.prs != ''
        run: |
          echo 'detecting conflicts...'
          PR_DATA='${{ steps.process-pr.outputs.prs }}'
          echo "PR_DATA=$PR_DATA" >> $GITHUB_OUTPUT

      - name: Analyze PR for Conflicts
        if: steps.process-pr.outputs.prs != '[]' && steps.process-pr.outputs.prs != ''
        uses: actions/github-script@v7
        id: analyze-conflicts
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = JSON.parse(process.env.PR_DATA || '[]');
            const runId = '${{ steps.process-pr.outputs.runId }}';
            const runUrl = '${{ steps.process-pr.outputs.runUrl }}';

            if (!prs || prs.length === 0) {
              return { results: [] };
            }

            const results = [];

            for (const pr of prs) {
              const prNumber = pr.number;
              const branchName = pr.head.ref;
              const baseBranch = pr.base.ref;

              console.log(`Analyzing PR #${prNumber} (branch: ${branchName}, base: ${baseBranch}) for merge conflicts...`);

              // Try to get the merge status
              let mergeStatus = 'unknown';
              let conflictedFiles = [];
              let hasConflicts = false;

              try {
                // Check if PR can be merged (this will show conflicts if they exist)
                const mergeResponse = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber
                });

                mergeStatus = mergeResponse.data.mergeable_state || 'unknown';
                console.log(`PR #${prNumber} mergeable_state: ${mergeStatus}`);

                // If mergeable_state indicates conflicts, we need to fetch the conflicted files
                if (mergeStatus === 'dirty' || mergeStatus === 'blocked') {
                  // Try to get the merge commit or check for conflicts via compare
                  const compareResponse = await github.rest.repos.compareCommits({
                    owner,
                    repo,
                    base: baseBranch,
                    head: branchName
                  });

                  // Check for conflicts in the comparison
                  if (compareResponse.data.files) {
                    for (const file of compareResponse.data.files) {
                      // Note: GitHub API doesn't directly show conflict markers in compare
                      // We need to try merging or fetch the files with conflict markers
                    }
                  }
                }
              } catch (err) {
                console.log(`Error checking merge status: ${err.message}`);
              }

              // Try to fetch the PR branch and check for conflicts by attempting a merge
              let conflictFilesContent = new Map();
              let conflictDetails = [];

              if (mergeStatus === 'dirty' || mergeStatus === 'blocked' || mergeStatus === 'unknown') {
                console.log(`Attempting to detect conflicts by fetching branch content...`);

                // Get the tree of the PR branch
                try {
                  const branchResponse = await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${branchName}`
                  });
                  const headSha = branchResponse.data.object.sha;

                  // Get the base branch commit
                  const baseResponse = await github.rest.git.getRef({
                    owner,
                    repo,
                    ref: `heads/${baseBranch}`
                  });
                  const baseSha = baseResponse.data.object.sha;

                  // Try to merge using the merge endpoint (dry run)
                  try {
                    await github.rest.pulls.merge({
                      owner,
                      repo,
                      pull_number: prNumber,
                      commit_title: `Test merge for conflict detection`,
                      commit_message: 'Test merge',
                      merge_method: 'merge'
                    });
                  } catch (mergeErr) {
                    // Merge failed - likely due to conflicts
                    console.log(`Merge test failed (expected if conflicts exist): ${mergeErr.message}`);
                  }

                  // Fetch the files that might have conflicts by comparing
                  const filesResponse = await github.rest.pulls.listFiles({
                    owner,
                    repo,
                    pull_number: prNumber
                  });

                  // For each changed file, fetch its content from the PR branch
                  for (const file of filesResponse.data) {
                    if (file.status !== 'removed') {
                      try {
                        const contentResponse = await github.rest.repos.getContent({
                          owner,
                          repo,
                          path: file.filename,
                          ref: branchName
                        });

                        if (contentResponse.data.content) {
                          const content = Buffer.from(contentResponse.data.content, 'base64').toString('utf-8');
                          // Check if content has conflict markers
                          if (content.includes('<<<<<<<') && content.includes('=======') && content.includes('>>>>>>>')) {
                            hasConflicts = true;
                            conflictedFiles.push(file.filename);
                            conflictFilesContent.set(file.filename, content);
                            console.log(`Found conflict markers in: ${file.filename}`);
                          }
                        }
                      } catch (contentErr) {
                        console.log(`Could not fetch content for ${file.filename}: ${contentErr.message}`);
                      }
                    }
                  }
                } catch (err) {
                  console.log(`Error during conflict detection: ${err.message}`);
                }
              }

              // Extract package info from PR title
              const title = pr.title;
              const regex = /bump(?:s)?\s+\[?([a-zA-Z0-9_\-\/@\.]+)(?:\]\([^\)]*\))?\s+from\s+(\S+)\s+to\s+(\S+)/i;
              const match = title.match(regex);
              const packageName = match ? match[1] : 'a dependency';
              const targetVersion = match ? match[3] : 'new version';

              results.push({
                prNumber,
                branchName,
                baseBranch,
                packageName,
                targetVersion,
                hasConflicts,
                conflictedFiles,
                conflictFilesContent: Object.fromEntries(conflictFilesContent),
                runId,
                runUrl,
                repository: `${owner}/${repo}`
              });

              console.log(`PR #${prNumber}: hasConflicts=${hasConflicts}, conflictedFiles=${conflictedFiles.join(', ')}`);
            }

            return { results };
          result-encoding: string

      - name: Generate Enhanced Task with Conflict Analysis
        if: steps.analyze-conflicts.outputs.result != '{}' && steps.analyze-conflicts.outputs.result != ''
        id: generate-task
        run: |
          echo "Generating enhanced task with conflict analysis..."
          ANALYSIS_RESULT='${{ steps.analyze-conflicts.outputs.result }}'
          echo "ANALYSIS_RESULT=$ANALYSIS_RESULT" > analysis_result.json

          # Run the merge-conflict-analyzer to generate task templates
          cat > generate_task.mjs << 'EOF'
          import { MergeConflictAnalyzer } from './.github/workflows/scripts/merge-conflict-analyzer.js';
          import fs from 'fs';

          const analysisResult = JSON.parse(fs.readFileSync('analysis_result.json', 'utf-8'));
          const results = analysisResult.results || [];

          for (const pr of results) {
            let enhancedTask = '';
            let mergeConflictContext = undefined;

            if (pr.hasConflicts && pr.conflictedFiles.length > 0) {
              console.log(`Analyzing conflicts for PR #${pr.prNumber}...`);

              // Create file map for merge-conflict-analyzer
              const filesMap = new Map(Object.entries(pr.conflictFilesContent || {}));

              // Run merge conflict analysis
              const analysis = MergeConflictAnalyzer.analyzeConflicts(filesMap);

              // Generate Jules task template with conflict details
              const template = MergeConflictAnalyzer.createJulesTaskTemplate(analysis, {
                prNumber: pr.prNumber,
                branchName: pr.branchName,
                packageName: pr.packageName,
                targetVersion: pr.targetVersion,
                repository: pr.repository,
                failedRunUrl: pr.runUrl
              });

              enhancedTask = template.task;
              mergeConflictContext = {
                hasConflict: true,
                conflictedFiles: pr.conflictedFiles,
                baseBranch: pr.baseBranch,
                headBranch: pr.branchName,
                conflictMarkers: ['<<<<<<< HEAD', '=======', '>>>>>>>']
              };

              console.log(`Generated conflict-aware task for PR #${pr.prNumber}`);
              console.log(`Conflict summary: ${analysis.conflictedFiles.length} files, ${analysis.totalConflicts} conflicts`);
            } else {
              // No conflicts - generate standard task
              enhancedTask = `@jules The Dependabot PR #${pr.prNumber} (branch: \`${pr.branchName}\`) attempted to update \`${pr.packageName}\` to version \`${pr.targetVersion}\` but failed CI. Please fix the code to be compatible with the new dependency version and commit to the same branch.`;
              mergeConflictContext = {
                hasConflict: false,
                conflictedFiles: [],
                baseBranch: pr.baseBranch,
                headBranch: pr.branchName
              };
              console.log(`Generated standard task for PR #${pr.prNumber} (no conflicts)`);
            }

            // Store enhanced task and context for validation
            pr.enhancedTask = enhancedTask;
            pr.mergeConflictContext = mergeConflictContext;
          }

          fs.writeFileSync('enhanced_tasks.json', JSON.stringify({ results }, null, 2));
          console.log('Enhanced tasks generated successfully');
          EOF

          pnpm exec tsx generate_task.mjs
          ENHANCED_TASKS=$(cat enhanced_tasks.json)
          echo "ENHANCED_TASKS=$ENHANCED_TASKS" >> $GITHUB_OUTPUT

      - name: Validate Tasks with Jules Task Validator
        if: steps.generate-task.outputs.ENHANCED_TASKS != '' && steps.generate-task.outputs.ENHANCED_TASKS != '{}'
        id: validate-tasks
        run: |
          echo "Validating tasks with Jules Task Validator..."
          ENHANCED_TASKS='${{ steps.generate-task.outputs.ENHANCED_TASKS }}'
          echo "ENHANCED_TASKS=$ENHANCED_TASKS" > enhanced_tasks.json

          cat > validate_tasks.mjs << 'EOF'
          import { JulesTaskValidator } from './.github/workflows/scripts/jules-task-validator.js';
          import fs from 'fs';

          const data = JSON.parse(fs.readFileSync('enhanced_tasks.json', 'utf-8'));
          const results = data.results || [];

          const validatedResults = [];

          for (const pr of results) {
            const validationResult = JulesTaskValidator.validateTaskForJules({
              task: pr.enhancedTask,
              mergeConflictContext: pr.mergeConflictContext,
              targetBranch: pr.branchName,
              repository: pr.repository
            });

            pr.validationResult = validationResult;
            pr.sanitizedTask = validationResult.sanitizedTask;
            pr.isValid = validationResult.isValid;
            pr.warnings = validationResult.warnings;
            pr.errors = validationResult.errors;

            console.log(`PR #${pr.prNumber}: isValid=${validationResult.isValid}`);
            if (validationResult.warnings.length > 0) {
              console.log(`  Warnings: ${validationResult.warnings.join('; ')}`);
            }
            if (validationResult.errors.length > 0) {
              console.log(`  Errors: ${validationResult.errors.join('; ')}`);
            }
            console.log(`  Sanitized task preview: ${validationResult.sanitizedTask.substring(0, 200)}...`);
          }

          fs.writeFileSync('validated_tasks.json', JSON.stringify({ results }, null, 2));
          console.log('Task validation completed');
          EOF

          pnpm exec tsx validate_tasks.mjs
          VALIDATED_TASKS=$(cat validated_tasks.json)
          echo "VALIDATED_TASKS=$VALIDATED_TASKS" >> $GITHUB_OUTPUT

      - name: Call Jules API for Valid Tasks
        if: steps.validate-tasks.outputs.VALIDATED_TASKS != '' && steps.validate-tasks.outputs.VALIDATED_TASKS != '{}'
        id: call-jules
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          echo "Calling Jules API for validated tasks..."
          VALIDATED_TASKS='${{ steps.validate-tasks.outputs.VALIDATED_TASKS }}'
          echo "VALIDATED_TASKS=$VALIDATED_TASKS" > validated_tasks.json

          cat > call_jules.mjs << 'EOF'
          import fs from 'fs';

          const data = JSON.parse(fs.readFileSync('validated_tasks.json', 'utf-8'));
          const results = data.results || [];

          const julesApiKey = process.env.JULES_API_KEY;
          if (!julesApiKey) {
            console.error('JULES_API_KEY not set!');
            process.exit(1);
          }

          const apiResults = [];

          for (const pr of results) {
            if (!pr.isValid) {
              console.log(`Skipping PR #${pr.prNumber}: validation failed`);
              apiResults.push({
                prNumber: pr.prNumber,
                success: false,
                error: 'Validation failed',
                validationErrors: pr.errors,
                validationWarnings: pr.warnings
              });
              continue;
            }

            console.log(`Calling Jules API for PR #${pr.prNumber}...`);

            try {
              const response = await fetch('https://jules.googleapis.com/v1/tasks', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${julesApiKey}`
                },
                body: JSON.stringify({
                  task: pr.sanitizedTask,
                  repository: pr.repository,
                  branch: pr.branchName,
                  pull_request_number: pr.prNumber,
                  failed_ci_run: pr.runUrl
                })
              });

              if (!response.ok) {
                const errText = await response.text();
                throw new Error(`Status ${response.status}: ${errText}`);
              }

              const result = await response.json();
              console.log(`Jules API call successful for PR #${pr.prNumber}: ${JSON.stringify(result)}`);

              apiResults.push({
                prNumber: pr.prNumber,
                success: true,
                julesResponse: result,
                validationWarnings: pr.warnings
              });
            } catch (error) {
              console.error(`Jules API call failed for PR #${pr.prNumber}: ${error.message}`);
              apiResults.push({
                prNumber: pr.prNumber,
                success: false,
                error: error.message,
                validationWarnings: pr.warnings
              });
            }
          }

          fs.writeFileSync('jules_results.json', JSON.stringify({ results: apiResults }, null, 2));
          console.log('Jules API calls completed');
          EOF

          pnpm exec tsx call_jules.mjs
          JULES_RESULTS=$(cat jules_results.json)
          echo "JULES_RESULTS=$JULES_RESULTS" >> $GITHUB_OUTPUT

      - name: Update PR Comments with Structured Info
        if: steps.call-jules.outputs.JULES_RESULTS != '' && steps.call-jules.outputs.JULES_RESULTS != '{}'
        uses: actions/github-script@v7
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const julesResults = JSON.parse(process.env.JULES_RESULTS || '{"results":[]}');
            const validatedTasks = JSON.parse(process.env.VALIDATED_TASKS || '{"results":[]}');

            if (!julesResults.results || julesResults.results.length === 0) {
              console.log('No Jules results to process');
            }

            for (const result of julesResults.results) {
              const prNumber = result.prNumber;
              const prData = validatedTasks.results?.find(p => p.prNumber === prNumber);

              if (!prData) {
                console.log(`No PR data found for #${prNumber}, skipping comment`);
                continue;
              }

              let commentBody = '';

              if (result.success) {
                commentBody = `## @jules Agent Triggered Successfully\n\n`;
                commentBody += `**PR #${prNumber}** (branch: \`${prData.branchName}\`)\n\n`;
                commentBody += `The Dependabot PR failed CI. The **@jules** agent has been triggered via API to fix the incompatibilities directly on the branch.\n\n`;

                if (prData.hasConflicts) {
                  commentBody += `### ⚠️ Merge Conflicts Detected\n\n`;
                  commentBody += `**${prData.conflictedFiles.length} conflicted file(s)** found. The task sent to Jules includes:\n\n`;
                  commentBody += `- Per-file resolution strategies\n`;
                  commentBody += `- Conflict diffs with markers\n`;
                  commentBody += `- Recommended commands for dependency files\n\n`;

                  commentBody += `**Conflicted Files:**\n`;
                  for (const file of prData.conflictedFiles) {
                    commentBody += `- \`${file}\`\n`;
                  }
                  commentBody += `\n`;
                }

                if (prData.validationResult?.warnings && prData.validationResult.warnings.length > 0) {
                  commentBody += `### Validation Warnings\n\n`;
                  for (const warning of prData.validationResult.warnings) {
                    commentBody += `- ${warning}\n`;
                  }
                  commentBody += `\n`;
                }

                commentBody += `### Task Sent to Jules\n\n`;
                commentBody += `\`\`\`\n${prData.sanitizedTask}\n\`\`\`\n\n`;

                commentBody += `--- \n`;
                commentBody += `*Triggered by Dependabot PR Failure workflow • Run: ${prData.runUrl}*`;
              } else {
                commentBody = `## ❌ @jules Agent Trigger Failed\n\n`;
                commentBody += `**PR #${prNumber}** (branch: \`${prData.branchName}\`)\n\n`;
                commentBody += `The attempt to trigger the **@jules** agent failed.\n\n`;

                if (result.error) {
                  commentBody += `**Error:** ${result.error}\n\n`;
                }

                if (prData.validationResult?.errors && prData.validationResult.errors.length > 0) {
                  commentBody += `**Validation Errors:**\n\n`;
                  for (const error of prData.validationResult.errors) {
                    commentBody += `- ${error}\n`;
                  }
                  commentBody += `\n`;
                }

                if (prData.validationResult?.warnings && prData.validationResult.warnings.length > 0) {
                  commentBody += `**Validation Warnings:**\n\n`;
                  for (const warning of prData.validationResult.warnings) {
                    commentBody += `- ${warning}\n`;
                  }
                  commentBody += `\n`;
                }

                commentBody += `### Task (Not Sent)\n\n`;
                commentBody += `\`\`\`\n${prData.enhancedTask}\n\`\`\`\n\n`;

                commentBody += `--- \n`;
                commentBody += `*Failed by Dependabot PR Failure workflow • Run: ${prData.runUrl}*`;
              }

              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body: commentBody
                });
                console.log(`Comment posted on PR #${prNumber}`);
              } catch (err) {
                console.error(`Failed to post comment on PR #${prNumber}: ${err.message}`);
              }
            }

      - name: Log Summary
        if: always()
        run: |
          echo "=== Dependabot PR Failure Workflow Summary ==="
          echo "Run ID: ${{ steps.process-pr.outputs.runId }}"
          echo "Run URL: ${{ steps.process-pr.outputs.runUrl }}"
          if [ -f "validated_tasks.json" ]; then
            echo "Validated Tasks:"
            cat validated_tasks.json | jq -r '.results[] | "PR #\(.prNumber): valid=\(.isValid) warnings=\(.warnings|length) errors=\(.errors|length)"'
          fi
          if [ -f "jules_results.json" ]; then
            echo "Jules API Results:"
            cat jules_results.json | jq -r '.results[] | "PR #\(.prNumber): success=\(.success) \(.error // "")"'
          fi
          echo "=== End Summary ==="