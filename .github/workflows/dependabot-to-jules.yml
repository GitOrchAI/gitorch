name: Dependabot → Jules

# Robô único (consolida os antigos dependabot-alert-to-issue + manual-dependabot-processor):
#   alerta do Dependabot → IA (rota free) monta prompt rico → cria issue → espera 10s →
#   adiciona label 'jules'. Três formas de disparar.

on:
  # IMPORTANTE: 'dependabot_alert' é um evento de WEBHOOK, mas NÃO dispara workflows
  # (não é um trigger válido do Actions). O gatilho automático é o schedule de hora em hora,
  # que varre os alertas abertos — suficiente para o SLA de 1 dia útil.
  schedule:
    - cron: '0 * * * *'
  # Manual: processa números específicos (ou todos os abertos se vazio).
  workflow_dispatch:
    inputs:
      alert_numbers:
        description: 'Números de alerta separados por vírgula (vazio = todos os abertos)'
        required: false
        type: string

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: dependabot-to-jules
  cancel-in-progress: false

jobs:
  create-jules-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Determine Alerts to Process
        id: alerts
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.alert_numbers }}" ]; then
            ALERTS_JSON="[${{ github.event.inputs.alert_numbers }}]"
          else
            echo "Buscando todos os alertas abertos do Dependabot..."
            ALERT_NUMS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" \
              --jq '.[].number' | tr '\n' ',' | sed 's/,$//')
            if [ -n "$ALERT_NUMS" ]; then ALERTS_JSON="[$ALERT_NUMS]"; else ALERTS_JSON="[]"; fi
          fi
          echo "alerts=$ALERTS_JSON" >> "$GITHUB_OUTPUT"
          echo "Alertas a processar: $ALERTS_JSON"

      - name: Process Each Alert
        if: steps.alerts.outputs.alerts != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          LABEL_DELAY_MS: '10000'
          ISSUE_CREATION_DELAY_MS: '300000'
        working-directory: .github/scripts
        run: |
          ALERTS=$(echo '${{ steps.alerts.outputs.alerts }}' | jq -c '.')
          COUNT=$(echo "$ALERTS" | jq 'length')
          echo "Processando $COUNT alerta(s)..."

          for i in $(seq 0 $((COUNT - 1))); do
            ALERT_NUM=$(echo "$ALERTS" | jq -r ".[$i]")
            echo "==== Alerta #$ALERT_NUM ($((i+1))/$COUNT) ===="

            # Dedup: já existe issue para este alerta?
            EXISTING=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues?state=all&per_page=100&labels=jules" \
              --jq ".[] | select(.body | contains(\"dependabot-alert-number: $ALERT_NUM\")) | .number" 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              echo "Já existe issue #$EXISTING para o alerta #$ALERT_NUM. Pulando."
            else
              echo "Gerando prompt (rota free)..."
              PROMPT_OUTPUT="$(npx tsx generate-jules-prompt.ts "$ALERT_NUM" 2>&1)" || {
                echo "::error::Falha ao gerar prompt para o alerta #$ALERT_NUM"
                echo "$PROMPT_OUTPUT"
                exit 1
              }

              PROMPT_JSON=$(echo "$PROMPT_OUTPUT" | sed -n '/=== GENERATED PROMPT ===/,/=== END PROMPT ===/p' | sed '1d;$d')
              if [ -z "$PROMPT_JSON" ] || ! echo "$PROMPT_JSON" | jq empty 2>/dev/null; then
                PROMPT_JSON=$(echo "$PROMPT_OUTPUT" | grep -E '^\s*\{' | tail -1)
              fi

              TITLE=$(echo "$PROMPT_JSON" | jq -r '.title')
              BODY=$(echo "$PROMPT_JSON" | jq -r '.body')
              LABELS=$(echo "$PROMPT_JSON" | jq -r '.labels | join(",")')

              # Cria a issue (via arquivo JSON para suportar corpo grande/especial).
              REQUEST_FILE=$(mktemp)
              jq -n \
                --arg title "$TITLE" \
                --arg body "$BODY" \
                --argjson labels "$(echo "$LABELS" | jq -R 'split(",")')" \
                '{title: $title, body: $body, labels: $labels}' > "$REQUEST_FILE"
              ISSUE_OUTPUT=$(gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/issues" \
                --input "$REQUEST_FILE")
              rm -f "$REQUEST_FILE"
              ISSUE_NUM=$(echo "$ISSUE_OUTPUT" | jq -r '.number // empty')

              if [ -z "$ISSUE_NUM" ]; then
                echo "::error::Falha ao criar issue para o alerta #$ALERT_NUM"
                echo "$ISSUE_OUTPUT"
                exit 1
              fi
              echo "Criada issue #$ISSUE_NUM"

              # Espera 10s e adiciona a label 'jules' (dispara o Jules).
              sleep $((LABEL_DELAY_MS / 1000))
              LABEL_FILE=$(mktemp)
              jq -n '{labels: ["jules"]}' > "$LABEL_FILE"
              gh api --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/issues/$ISSUE_NUM/labels" \
                --input "$LABEL_FILE" > /dev/null
              rm -f "$LABEL_FILE"
              echo "Label 'jules' adicionada à issue #$ISSUE_NUM"
            fi

            # Espaça 5 min entre alertas (evita rajada que dá 'failed to create a task' no Jules).
            if [ $i -lt $((COUNT - 1)) ]; then
              echo "Aguardando ${ISSUE_CREATION_DELAY_MS}ms antes do próximo alerta..."
              sleep $((ISSUE_CREATION_DELAY_MS / 1000))
            fi
          done
