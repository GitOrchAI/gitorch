name: Infra Guard

# Fronteira open-core: mecaniza que segredos, IPs internos, hostnames e paths
# absolutos da NOSSA VM — e agora também referências ao repo IRMÃO privado
# gitorch-cloud (infra de nuvem/SaaS, manifest de versão de motores) — não
# vazem para o repositório público. Workflow leve e independente do
# zero-tolerance (feedback rápido, falha cedo, e sobrevive a edições no
# ci.yml). O gitleaks aqui é defesa-em-profundidade + fail-fast; o
# zero-tolerance mantém o dele no gate principal.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  infra-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Denylist de infra (paths de VM, IPs internos, hostnames Tailscale, repo privado gitorch-cloud)
        env:
          # PR: diff vs base da PR. push: diff vs commit anterior. O script cai
          # para HEAD~1 se a ref não resolver (ex.: primeiro push).
          INFRA_GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/infra-guard.sh
      - name: Secret scan (gitleaks)
        env:
          # A ferramenta gitleaks (MIT) roda sem chave nenhuma. Quem exige
          # cadastro para conta de organizacao e a Action que a embrulha —
          # e este repositorio passou a pertencer a uma organizacao, o que
          # deixou o scan vermelho em TODO PR e na propria main. Instalar o
          # binario oficial mantem exatamente a mesma varredura, sem depender
          # de segredo de terceiro. Versao pinada: build reproduzivel.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          gitleaks detect --source . --redact --exit-code 1 \
            --report-format sarif --report-path results.sarif
