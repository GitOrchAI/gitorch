name: Jules Apology Handler

# Quando o Jules comenta que NÃO conseguiu completar a tarefa ("I apologize… wasn't able to
# complete"), lemos a sessão dele pela Jules API, entendemos o motivo, e a LLM (rota free) escreve
# uma orientação que mandamos de volta via sendMessage. Política: tenta 1x; se falhar de novo,
# escala para humano (label 'needs-human' + menção) em vez de entrar em loop.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  handle-apology:
    runs-on: ubuntu-latest
    # Gate amplo: comentário de bot do Jules. A detecção precisa (apology) é feita no step.
    if: >-
      contains(github.event.comment.user.login, 'jules') ||
      github.event.comment.user.login == 'google-labs-jules[bot]'
    steps:
      - name: Triagem (apology? sessão? já tentou?)
        id: triage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECURITY_PAT || github.token }}
          script: |
            const body = context.payload.comment.body || '';
            const isApology = /I apologize|wasn'?t able to complete|cannot complete|could not complete|unable to (complete|resolve)|não consegui|n[ãa]o consigo/i.test(body);
            if (!isApology) { console.log('Comentário não é apology. Encerrando.'); core.setOutput('act', 'false'); return; }

            const m = body.match(/jules\.google\.com\/(?:task|sessions)\/([A-Za-z0-9_-]+)/) || body.match(/sessions\/([A-Za-z0-9_-]+)/);
            const sessionId = m ? m[1] : '';

            const issueNumber = context.payload.issue.number;
            const labels = (await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber
            })).data.map(l => l.name);
            const alreadyTried = labels.includes('jules-apology-handled');

            console.log(`apology=true session=${sessionId || 'NÃO ACHADO'} issue=#${issueNumber} jaTentou=${alreadyTried}`);
            core.setOutput('act', 'true');
            core.setOutput('sessionId', sessionId);
            core.setOutput('issueNumber', String(issueNumber));
            core.setOutput('alreadyTried', alreadyTried ? 'true' : 'false');

      - name: Checkout
        if: steps.triage.outputs.act == 'true' && steps.triage.outputs.alreadyTried == 'false' && steps.triage.outputs.sessionId != ''
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECURITY_PAT || github.token }}

      - name: Setup Node
        if: steps.triage.outputs.act == 'true' && steps.triage.outputs.alreadyTried == 'false' && steps.triage.outputs.sessionId != ''
        uses: ./.github/actions/setup-pnpm

      - name: Install Dependencies
        if: steps.triage.outputs.act == 'true' && steps.triage.outputs.alreadyTried == 'false' && steps.triage.outputs.sessionId != ''
        working-directory: .github/scripts
        run: pnpm install --ignore-workspace

      - name: Orientar Jules (1ª tentativa)
        if: steps.triage.outputs.act == 'true' && steps.triage.outputs.alreadyTried == 'false' && steps.triage.outputs.sessionId != ''
        working-directory: .github/scripts
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
          GH_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npx tsx analyze-jules-failure.ts "${{ steps.triage.outputs.sessionId }}" "${{ steps.triage.outputs.issueNumber }}"
          # Marca que já orientamos uma vez (para a próxima apology escalar).
          gh issue edit "${{ steps.triage.outputs.issueNumber }}" --add-label "jules-apology-handled" --repo "${{ github.repository }}"

      - name: Escalar para humano (2ª apology ou sem sessão)
        if: steps.triage.outputs.act == 'true' && (steps.triage.outputs.alreadyTried == 'true' || steps.triage.outputs.sessionId == '')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SECURITY_PAT || github.token }}
          script: |
            const issue_number = parseInt('${{ steps.triage.outputs.issueNumber }}', 10);
            const owner = context.repo.owner, repo = context.repo.repo;
            const noSession = '${{ steps.triage.outputs.sessionId }}' === '';
            const motivo = noSession
              ? 'não foi possível identificar a sessão do Jules no comentário'
              : 'o Jules apologizou de novo mesmo após orientação automática';
            try { await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-human'] }); } catch (e) {}
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `@loureng 🚨 **Impasse com o Jules** — ${motivo}. A automação parou de insistir para não gastar cota em loop. Precisa de decisão humana (ex.: aprovar um upgrade que quebra, ou ajustar o escopo).`
            });
            console.log('Escalado para humano.');
