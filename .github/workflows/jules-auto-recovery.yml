name: Jules Auto-Recovery

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  recover:
    runs-on: ubuntu-latest
    if: |
      (contains(github.event.comment.user.login, 'jules') || github.event.comment.user.login == 'google-labs-jules[bot]') &&
      contains(github.event.comment.body, 'Jules has failed to create a task')
    steps:
      - name: Auto-Retry Jules
        uses: actions/github-script@v7
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
        with:
          github-token: ${{ secrets.SECURITY_PAT || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;

            // O erro "failed to create a task" vem de rajada / limite de tarefas simultâneas
            // do Jules. Esperar 3s não adianta (a vaga não abre em 3s). Tentamos em ciclos
            // de minutos: remove label → readiciona → espera → confirma se o Jules engajou.
            const MAX_CYCLES = 5;
            const WAIT_MS = 150000; // 2.5 min entre ciclos

            console.log(`Auto-recuperação do Jules para issue #${issueNumber} (até ${MAX_CYCLES} ciclos)...`);

            for (let cycle = 1; cycle <= MAX_CYCLES; cycle++) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: 'jules' });
              } catch (err) {
                console.log(`Ciclo ${cycle}: label já estava removida (${err.message}).`);
              }
              await new Promise(r => setTimeout(r, 5000));

              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: ['jules'] });
                console.log(`Ciclo ${cycle}: label 'jules' readicionada. Aguardando ${WAIT_MS / 60000}min...`);
              } catch (err) {
                console.error(`Ciclo ${cycle}: erro ao adicionar label: ${err.message}`);
              }

              await new Promise(r => setTimeout(r, WAIT_MS));

              // O Jules reclamou de novo nesta janela? Se não, consideramos engajado.
              const since = new Date(Date.now() - WAIT_MS - 10000).toISOString();
              const comments = await github.rest.issues.listComments({
                owner, repo, issue_number: issueNumber, per_page: 10, sort: 'created', direction: 'desc'
              });
              const stillFailing = comments.data.some(
                c => c.created_at > since && /failed to create a task/i.test(c.body || '')
              );

              if (!stillFailing) {
                console.log(`Jules engajou (sem novo erro). Encerrando no ciclo ${cycle}.`);
                break;
              }
              console.log(`Ciclo ${cycle}: Jules ainda falhando, novo ciclo...`);
            }
