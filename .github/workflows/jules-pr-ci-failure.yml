name: Jules PR CI Failure Fallback

on:
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number para forçar a análise agora (ignora a espera de 1 dia útil)'
        required: true
        type: string

permissions:
  pull-requests: write
  issues: write
  actions: read
  contents: read

jobs:
  fallback-on-ci-failure:
    name: Fallback CI Failure Analysis (1+ business day)
    runs-on: ubuntu-latest
    # Elegibilidade NÃO é gateada por label (PR do Jules não tem label 'jules'); o script
    # analyze-ci-failure.ts confirma se o PR é da automação antes de comentar.
    if: github.event_name == 'workflow_dispatch' || github.event.check_suite.conclusion == 'failure'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT || github.token }}

      - name: Setup Node (pnpm)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Analyze CI Failure
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
          GH_TOKEN: ${{ secrets.SECURITY_PAT || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SLA_BUSINESS_DAYS: ${{ env.SLA_BUSINESS_DAYS || '1' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
            echo "Disparo manual para PR #$PR_NUM — ignorando espera de 1 dia útil."
            SLA_BUSINESS_DAYS=0 npx tsx analyze-ci-failure.ts "$PR_NUM"
            exit 0
          fi

          PR_NUM="${{ github.event.check_suite.pull_requests[0].number }}"
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "Check suite sem PR associado. Nada a fazer."
            exit 0
          fi

          echo "Checking PR #$PR_NUM age..."
          CREATED_AT=$(gh pr view $PR_NUM --json createdAt --jq '.createdAt' --repo ${{ github.repository }})

          # Check business days since creation using Node.js
          BUSINESS_DAYS=$(node -e "
            const created = new Date('$CREATED_AT');
            const now = new Date();
            let days = 0;
            const check = new Date(created);
            while (check < now) {
              check.setDate(check.getDate() + 1);
              if (check.getDay() !== 0 && check.getDay() !== 6) days++;
            }
            console.log(days);
          ")

          echo "PR #$PR_NUM is $BUSINESS_DAYS business day(s) old"

          if [ "$BUSINESS_DAYS" -ge "${{ env.SLA_BUSINESS_DAYS }}" ]; then
            echo "PR exceeds 1 business day. Running fallback analysis..."
            npx tsx analyze-ci-failure.ts "$PR_NUM"
          else
            echo "PR is within SLA ($BUSINESS_DAYS < ${{ env.SLA_BUSINESS_DAYS }}). Jules built-in auto-fix should handle this."
            echo "Skipping fallback analysis."
          fi
        working-directory: .github/scripts