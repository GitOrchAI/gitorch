name: Jules PR Conflict Resolver

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
  # Quando a main move, PRs abertos podem ficar conflitantes sem disparar evento de PR.
  # Este push varre todos os PRs da automação em busca de novos conflitos.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to analyze (optional)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  resolve-conflicts:
    name: Analyze & Resolve Merge Conflicts
    runs-on: ubuntu-latest
    # Elegibilidade NÃO é gateada por label (PR do Jules não tem label 'jules'); quem decide é o
    # script (isSecurityAutomationPR). Aqui só filtramos os tipos de evento relevantes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Analyze Merge Conflicts
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            PR_NUM=""  # push na main → varredura de todos os PRs da automação
          fi

          if [ -n "$PR_NUM" ]; then
            echo "Analisando PR #$PR_NUM (conflitos)..."
            npx tsx analyze-conflicts.ts "$PR_NUM"
          else
            echo "Varrendo todos os PRs da automação (main moveu)..."
            npx tsx analyze-conflicts.ts
          fi
        working-directory: .github/scripts

      - name: Remove Conflict Label if Resolved
        if: success() && github.event_name == 'pull_request_target' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          # Check if PR is now mergeable (conflicts resolved)
          MERGEABLE=$(gh pr view "$PR_NUM" --json mergeable --jq '.mergeable' --repo ${{ github.repository }})
          if [ "$MERGEABLE" = "MERGEABLE" ]; then
            echo "PR #$PR_NUM is now mergeable. Removing 'jules-conflict-notified' label..."
            gh pr edit "$PR_NUM" --remove-label "jules-conflict-notified" --repo ${{ github.repository }} || true
          fi
        working-directory: .github/scripts