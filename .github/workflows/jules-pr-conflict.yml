name: Jules PR Conflict Resolver

# LIGADO por RELÓGIO e por PUSH NA MAIN. Nunca por pull_request_target — foi exatamente esse
# gatilho que, em 05/08, deixou VERMELHO todo PR do repositório (inclusive os que nada tinham a
# ver com esta automação) e motivou o desligamento. Um workflow que roda dentro do PR não pode
# gatear o trabalho de ninguém; rodando no relógio e no push da main, ele não aparece no checks
# de PR nenhum.
#
# Correção do cabeçalho que ficou aqui de 01/07 a 31/08: ele afirmava que SECURITY_PAT e
# OPENROUTER_API_KEY "não existem nesta organização". Os dois EXISTEM no repositório —
# SECURITY_PAT desde 21/08 e OPENROUTER_API_KEY desde 02/08 (`gh secret list`). A afirmação
# falsa é o que manteve a automação desligada enquanto os conflitos se acumulavam: em 31/08,
# 10 dos 19 PRs abertos estavam CONFLICTING (medido com `gh pr list --json mergeable`). O passo
# "verificar se a automação está configurada" também saiu: ele testava
# `secrets.SECURITY_PAT || github.token`, que nunca é vazio, então nunca pulava nada — guarda
# morta que dava a impressão de proteger.
#
# Por que push na main: é o momento em que um PR aberto VIRA conflito. O relógio é a rede de
# segurança para o que já estava conflitado antes.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to analyze (optional)'
        required: false
        type: string
  schedule:
    # A cada 6 horas (fora da hora cheia, que é quando o agendador do GitHub mais atrasa).
    # O período do relógio TEM que ficar bem abaixo do cooldown de notificação
    # (CONFLICT_NOTIFICATION_COOLDOWN_MIN, abaixo): assim quem decide a frequência de aviso é o
    # cooldown, não o relógio. Se os dois fossem iguais ou próximos, toda varredura cairia
    # exatamente na borda do cooldown e viraria um comentário novo — que é o bombardeio que já
    # aconteceu (70 comentários em <24h no PR #202).
    - cron: '17 */6 * * *'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  # write por causa de issues.createLabel (endpoint de labels do repositório) usado pelo script
  # ao garantir que a label 'jules-conflict-notified' existe.
  issues: write

# Uma varredura por vez: duas rodando juntas leem a lista de comentários antes de qualquer uma
# postar, as duas passam pelo cooldown e o mesmo PR recebe dois avisos.
concurrency:
  group: jules-pr-conflict
  cancel-in-progress: false

jobs:
  resolve-conflicts:
    name: Analyze & Resolve Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT || github.token }}

      # Um passo só. Havia dois: `pnpm/action-setup@v4` fixando 9.4.0 e, logo abaixo, o composite
      # `setup-pnpm` — que roda `pnpm/action-setup@v4` de novo. O segundo instalava por cima do
      # primeiro e a versão fixada aqui não sobrevivia a nada.
      #
      # Tirar o pin não solta a versão: `pnpm/action-setup@v4` sem `version` lê o campo
      # `packageManager` do package.json da raiz, que é `pnpm@9.4.0` — o mesmo número. E é assim
      # que o `ci.yml` deste repositório já faz (só o composite, sem passo extra).
      #
      # O composite não declara `inputs`, então nada de `with:` aqui: `node-version` e
      # `check-latest`, que outros workflows ainda passam, são ignorados em silêncio.
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-pnpm

      # --ignore-workspace: sem ele o pnpm sobe até a raiz do monorepo, instala o workspace
      # inteiro e NÃO cria .github/scripts/node_modules — o script seguinte morre sem
      # @octokit/rest. É a forma usada pelos workflows que rodam verdes (sla-tracker, dependabot).
      - name: Install Dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Analyze Merge Conflicts
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          # 12h entre avisos no MESMO PR — o dobro do período do relógio (6h), para que nem a
          # varredura agendada nem uma sequência de merges na main transforme cada rodada em
          # comentário. O padrão do script é 20 min, curto demais para um gatilho de relógio.
          CONFLICT_NOTIFICATION_COOLDOWN_MIN: '720'
        working-directory: .github/scripts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          else
            PR_NUM=""  # relógio ou push na main → varredura de todos os PRs da automação
          fi

          # pnpm exec (não npx): usa o tsx pinado no lockfile que o passo anterior instalou, em
          # vez de baixar uma versão qualquer da rede.
          if [ -n "$PR_NUM" ]; then
            echo "Analisando PR #$PR_NUM (conflitos)..."
            pnpm exec tsx analyze-conflicts.ts "$PR_NUM"
          else
            echo "Varrendo todos os PRs da automação..."
            pnpm exec tsx analyze-conflicts.ts
          fi

      # Não existe passo separado para tirar a label 'jules-conflict-notified' quando o conflito
      # some: a própria varredura já remove a label do PR que voltou a ser mesclável
      # (analyze-conflicts.ts, ramo `else if` do laço da varredura). O passo que existia aqui só
      # rodava em pull_request_target/synchronize — gatilho que não volta.
