name: Jules PR Conflict Resolver

# DESLIGADO: so roda por disparo manual.
#
# Esta automacao precisa de SECURITY_PAT (credencial propria, para empurrar o
# merge resolvido de volta a branch do PR) e de OPENROUTER_API_KEY. Nenhum dos
# dois existe nesta organizacao, e o dev assincrono que ela atende tambem nao
# esta ligado — entao ela nao tinha o que resolver e mesmo assim falhava no
# checkout, deixando VERMELHO todo PR do repositorio, inclusive os que nada
# tinham a ver com ela. Um workflow que so pode falhar nao pode gatear o
# trabalho de ninguem.
#
# Para religar: cadastre os dois segredos na organizacao e devolva os gatilhos
# automaticos abaixo (pull_request_target nos tipos opened/synchronize/
# reopened/labeled, e push na main para varrer PRs que ficaram conflitantes
# quando a main moveu). O passo de verificacao de configuracao ja existe e
# deixa o fluxo pular sozinho enquanto os segredos faltarem.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR Number to analyze (optional)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  resolve-conflicts:
    name: Analyze & Resolve Merge Conflicts
    runs-on: ubuntu-latest
    # Elegibilidade NÃO é gateada por label (PR do Jules não tem label 'jules'); quem decide é o
    # script (isSecurityAutomationPR). Aqui só filtramos os tipos de evento relevantes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request_target'
    env:
      # Esta automacao so funciona com credencial propria (precisa empurrar o
      # merge resolvido de volta para a branch do PR). Sem o segredo cadastrado
      # ela nao tem o que fazer — e antes disto ela FALHAVA, deixando vermelho
      # todo PR do repositorio, inclusive os que nada tem a ver com o Jules.
      # Ausencia de credencial e "nao configurado", nao "quebrado": os passos
      # sao pulados e o job termina limpo. Cadastre SECURITY_PAT para ligar.
      SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
    steps:
      - name: Verificar se a automacao esta configurada
        id: preflight
        run: |
          if [ -z "${SECURITY_PAT:-}" ]; then
            echo "configurada=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SECURITY_PAT nao cadastrado — resolucao automatica de conflitos desligada neste repositorio."
          else
            echo "configurada=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.preflight.outputs.configurada == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT }}

      - name: Setup Node
        if: steps.preflight.outputs.configurada == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Dependencies
        if: steps.preflight.outputs.configurada == 'true'
        working-directory: .github/scripts
        run: npm ci

      - name: Analyze Merge Conflicts
        if: steps.preflight.outputs.configurada == 'true'
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: openrouter/free
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.pr_number }}" ]; then
            PR_NUM="${{ github.event.inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
          else
            PR_NUM=""  # push na main → varredura de todos os PRs da automação
          fi

          if [ -n "$PR_NUM" ]; then
            echo "Analisando PR #$PR_NUM (conflitos)..."
            npx tsx analyze-conflicts.ts "$PR_NUM"
          else
            echo "Varrendo todos os PRs da automação (main moveu)..."
            npx tsx analyze-conflicts.ts
          fi
        working-directory: .github/scripts

      - name: Remove Conflict Label if Resolved
        if: >-
          steps.preflight.outputs.configurada == 'true' &&
          success() && github.event_name == 'pull_request_target' &&
          github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.SECURITY_PAT }}
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          # Check if PR is now mergeable (conflicts resolved)
          MERGEABLE=$(gh pr view $PR_NUM --json mergeable --jq '.mergeable' --repo ${{ github.repository }})
          if [ "$MERGEABLE" = "MERGEABLE" ]; then
            echo "PR #$PR_NUM is now mergeable. Removing 'jules-conflict-notified' label..."
            gh pr edit $PR_NUM --remove-label "jules-conflict-notified" --repo ${{ github.repository }} || true
          fi
        working-directory: .github/scripts