name: Manual Dependabot Alert Processor

on:
  workflow_dispatch:
    inputs:
      alert_numbers:
        description: 'Comma-separated alert numbers to process (empty = all open)'
        required: false
        type: string

permissions:
  contents: read
  security-events: read
  issues: write

jobs:
  process-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SECURITY_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: .github/scripts
        run: bun install

      - name: Get Alert Numbers
        id: alerts
        env:
          GITHUB_TOKEN: ${{ secrets.SECURITY_PAT }}
        run: |
          if [ -n "${{ github.event.inputs.alert_numbers }}" ]; then
            ALERTS_JSON="[${{ github.event.inputs.alert_numbers }}]"
          else
            echo "Fetching all open Dependabot alerts..."
            ALERT_NUMS=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" \
              --jq '.[].number' | tr '\n' ',' | sed 's/,$//')
            if [ -n "$ALERT_NUMS" ]; then
              ALERTS_JSON="[$ALERT_NUMS]"
            else
              ALERTS_JSON="[]"
            fi
          fi
          echo "alerts=$ALERTS_JSON" >> $GITHUB_OUTPUT
          echo "Processing alerts: $ALERTS_JSON"

      - name: Debug Environment
        if: fromJson(steps.alerts.outputs.alerts) != '[]'
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "SECURITY_PAT length: ${#SECURITY_PAT}"
          echo "OPENROUTER_API_KEY length: ${#OPENROUTER_API_KEY}"
          echo "REPO_OWNER: ${{ github.repository_owner }}"
          echo "REPO_NAME: ${{ github.event.repository.name }}"

      - name: Test Script Directly
        if: fromJson(steps.alerts.outputs.alerts) != '[]'
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          echo "Testing script directly..."
          bun run generate-jules-prompt.ts 32 2>&1
          echo "Exit code: $?"
        working-directory: .github/scripts

      - name: Process Each Alert
        if: fromJson(steps.alerts.outputs.alerts) != '[]'
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_FREE_MODEL: ${{ env.OPENROUTER_FREE_MODEL || 'openrouter/free' }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          LABEL_DELAY_MS: ${{ env.LABEL_DELAY_MS || '10000' }}
          ISSUE_CREATION_DELAY_MS: ${{ env.ISSUE_CREATION_DELAY_MS || '300000' }}
        working-directory: .github/scripts
        run: |
          ALERTS=$(echo '${{ steps.alerts.outputs.alerts }}' | jq -c '.')
          COUNT=$(echo "$ALERTS" | jq 'length')

          echo "Processing $COUNT alert(s)..."

          for i in $(seq 0 $((COUNT - 1))); do
            ALERT_NUM=$(echo "$ALERTS" | jq -r ".[$i]")
            echo "=========================================="
            echo "Processing alert #$ALERT_NUM ($((i+1))/$COUNT)"
            echo "=========================================="

            # Check if issue already exists for this alert
            EXISTING=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/issues?state=all&per_page=100&labels=jules" \
              --jq ".[] | select(.body | contains(\"dependabot-alert-number: $ALERT_NUM\")) | .number" 2>/dev/null || echo "")

            if [ -n "$EXISTING" ]; then
              echo "Issue already exists for alert #$ALERT_NUM (issue #$EXISTING). Skipping."
            else
              # Generate Jules prompt
              echo "Generating Jules prompt..."
              echo "Running: bun run generate-jules-prompt.ts \"$ALERT_NUM\""
              PROMPT_OUTPUT="$(bun run generate-jules-prompt.ts "$ALERT_NUM" 2>&1)"
              EXIT_CODE=$?
              echo "Prompt generation exit code: $EXIT_CODE"
              echo "Prompt output (first 500 chars): ${PROMPT_OUTPUT:0:500}"
              echo "Prompt output (last 500 chars): ${PROMPT_OUTPUT: -500}"

              if [ $EXIT_CODE -ne 0 ]; then
                echo "::error::Failed to generate prompt for alert #$ALERT_NUM"
                echo "$PROMPT_OUTPUT"
                continue
              fi

              # Extract JSON from output (between === GENERATED PROMPT === markers, or last valid JSON)
              PROMPT_JSON=$(echo "$PROMPT_OUTPUT" | sed -n '/=== GENERATED PROMPT ===/,/=== END PROMPT ===/p' | sed '1d;$d')
              
              # If marker extraction failed, try to find last valid JSON line
              if [ -z "$PROMPT_JSON" ] || ! echo "$PROMPT_JSON" | jq empty 2>/dev/null; then
                PROMPT_JSON=$(echo "$PROMPT_OUTPUT" | grep -E '^\s*\{' | tail -1)
              fi

              TITLE=$(echo "$PROMPT_JSON" | jq -r '.title')
              BODY=$(echo "$PROMPT_JSON" | jq -r '.body')
              LABELS=$(echo "$PROMPT_JSON" | jq -r '.labels | join(",")')

              # Create issue
              echo "Creating issue..."
              # Write body to temp file to avoid issues with special characters and size limits
              BODY_FILE=$(mktemp)
              echo "$BODY" > "$BODY_FILE"
              echo "Body file size: $(wc -c < "$BODY_FILE") bytes"
              echo "Title: $TITLE"
              echo "Labels: $LABELS"
              # Convert labels to JSON array
              LABELS_JSON=$(echo "$LABELS" | sed 's/[^,]*/"&"/g' | sed 's/^/[/' | sed 's/$/]/')
              echo "Labels JSON: $LABELS_JSON"
              ISSUE_OUTPUT=$(gh api \
                --method POST \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/issues" \
                -f title="$TITLE" \
                -F body=@"$BODY_FILE" \
                -F "labels=$LABELS_JSON" 2>&1)
              ISSUE_EXIT_CODE=$?
              echo "Issue creation exit code: $ISSUE_EXIT_CODE"
              echo "Issue output: $ISSUE_OUTPUT"
              rm -f "$BODY_FILE"
              ISSUE_NUM=$(echo "$ISSUE_OUTPUT" | jq -r '.number // empty')

              if [ -n "$ISSUE_NUM" ]; then
                echo "Created issue #$ISSUE_NUM"

                # Wait before adding jules label (10 seconds per requirements)
                echo "Waiting ${LABEL_DELAY_MS}ms before adding 'jules' label..."
                sleep $((LABEL_DELAY_MS / 1000))

                # Add 'jules' label to trigger Jules
                gh api \
                  --method POST \
                  -H "Accept: application/vnd.github+json" \
                  "/repos/${{ github.repository }}/issues/$ISSUE_NUM/labels" \
                  -f "labels=[\"jules\"]" > /dev/null

                echo "Added 'jules' label to issue #$ISSUE_NUM"
              else
                echo "::error::Failed to create issue for alert #$ALERT_NUM"
                echo "$ISSUE_OUTPUT"
              fi
            fi

            # Wait 5 minutes between alerts (except for last one)
            if [ $i -lt $((COUNT - 1)) ]; then
              echo "Waiting ${ISSUE_CREATION_DELAY_MS}ms before next alert..."
              sleep $((ISSUE_CREATION_DELAY_MS / 1000))
            fi
          done