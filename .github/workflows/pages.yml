name: pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Aqui havia TRÊS instalações de pnpm: `@v6` avulso, o que o composite rodava
      # então (`@v4`) e `@v3` avulso — a última sobrescrevendo as anteriores. O pin
      # 9.4.0 do `@v3` não sobrevivia a nada, e o `cache: pnpm` dele era mais um
      # input inexistente ("Unexpected input(s) 'cache', valid inputs are
      # ['version','dest','run_install','package_json_file','standalone']" no run
      # 33339012691) — `cache` é input do setup-node, que o composite já passa.
      #
      # E o `node-version: 22` era ignorado igual ao do sla-tracker: o mesmo run
      # mostra "node-version: 22" pedido, "node-version: 20.x" aplicado,
      # "Acquiring 20.20.2". O site já é construído em Node 20 desde sempre; tirar
      # o número que nunca valeu não muda o build, só para de prometer 22.
      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        working-directory: apps/web
        env:
          # Valores por VARIÁVEIS do repositório (Settings → Variables) — nada
          # de URL de infraestrutura fixa em código.
          NEXT_PUBLIC_API_URL: ${{ vars.GITORCH_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: pnpm build
      # Rigor 1: se há basePath, os assets do _next TÊM que estar prefixados com
      # ele. Sem isso o site quebra no GitHub Pages (assets 404). Falha o build
      # ANTES de publicar — foi exatamente o que quebrou o site em 06/07.
      - name: Assert basePath nas páginas (home + setup + painel)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
        run: |
          BP="${NEXT_PUBLIC_BASE_PATH:-}"
          if [ -z "$BP" ]; then echo "Sem basePath (domínio raiz) — nada a checar."; exit 0; fi
          for f in index.html setup.html painel.html; do
            [ -f "out/$f" ] || { echo "::error::out/$f não existe (página faltando no build)."; exit 1; }
            if grep -qE '(src|href)="/_next/' "out/$f"; then
              echo "::error::$f: assets na RAIZ (/_next) apesar de basePath=$BP — quebraria no Pages."
              grep -oE '(src|href)="/_next[^"]*"' "out/$f" | head -3
              exit 1
            fi
            if ! grep -qE "(src|href)=\"$BP/_next/" "out/$f"; then
              echo "::error::$f: nenhum asset _next prefixado com $BP."
              exit 1
            fi
            echo "OK: $f com assets em $BP"
          done
      # Esta action e' `using: composite` — ela mesma nunca aparece no aviso de
      # Node 20. Quem aparecia era o `actions/upload-artifact` que ela chama por
      # dentro. ATENCAO ao "atualizar" para v4: NAO resolve nada — o manifesto do
      # v4 fixa `actions/upload-artifact@ea165f8d...  # v4.6.2`, exatamente o mesmo
      # SHA node20 que este repo ja usava. So' o v5.0.0 passa a chamar
      # `actions/upload-artifact@bbbca2dd...  # v7.0.0`, que e' node24.
      #
      # Quebra herdada do v4.0.0: arquivos ocultos (dotfiles) deixaram de entrar no
      # artefato. Inocuo aqui — o que sobe e' `apps/web/out`, gerado pelo build, e
      # o unico dotfile de apps/web e' o `.gitignore`, que fica fora de `out/`.
      # Se algum dia for preciso publicar um dotfile, o v5 tem `include-hidden-files`.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      # `actions/deploy-pages` rodava no job `deploy`, nao no `build`, entao o aviso
      # de Node 20 dela saia em anotacao SEPARADA do mesmo run — sao dois avisos,
      # nao um. Os dois inputs usados abaixo (`timeout`, `error_count`) continuam
      # existindo no v5; conferido no manifesto, porque o release v5.0.0 nao publicou
      # nota de migracao v4->v5 (o corpo dele fecha com um comparativo v4.0.5...v4.0.6).
      #
      # Rigor 2 + auto-cura: a infra do Pages falha com "try again later" de vez
      # em quando. Até 3 tentativas automáticas para uma falha transitória NUNCA
      # deixar o site quebrado (foi o que derrubou o site 2x em 06/07).
      - id: d1
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        continue-on-error: true
        with: { timeout: 600000, error_count: 25 }
      - if: steps.d1.outcome == 'failure'
        run: echo "Deploy 1 falhou (transitório); tentando de novo em 20s" && sleep 20
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        continue-on-error: true
        with: { timeout: 600000, error_count: 25 }
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: echo "Deploy 2 falhou; última tentativa em 30s" && sleep 30
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        with: { timeout: 600000, error_count: 25 }
      # Se as 3 falharem, o job falha (e o smoke nem roda) — vai vermelho, não
      # verde-falso. Mas o esperado é uma das 3 passar e o site se curar sozinho.
  smoke:
    # Rigor 3: só passa se o site publicado E seus assets carregarem de verdade.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verifica páginas publicadas + assets (home + setup + painel)
        run: |
          HOST="https://${{ github.repository_owner }}.github.io"
          PREFIX="${{ vars.GITORCH_PAGES_BASE_PATH }}"
          fail=0
          for path in "/" "/setup" "/painel"; do
            URL="$HOST$PREFIX$path"
            HTML=""
            for i in 1 2 3 4 5 6 7 8; do
              HTML=$(curl -fsSL "$URL" 2>/dev/null) && [ -n "$HTML" ] && break
              echo "[$path] tentativa $i: aguardando CDN..."; sleep 15
            done
            if [ -z "$HTML" ]; then echo "::error::$URL não respondeu"; fail=1; continue; fi
            ASSET=$(echo "$HTML" | grep -oE '/[A-Za-z0-9/_.-]*_next/static/[A-Za-z0-9/_.-]+\.(js|css)' | head -1)
            if [ -z "$ASSET" ]; then echo "::error::$URL sem asset _next no HTML"; fail=1; continue; fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HOST$ASSET")
            echo "$path -> asset HTTP $CODE"
            if [ "$CODE" != "200" ]; then echo "::error::$URL: asset retornou $CODE (página quebrada)"; fail=1; fi
          done
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "OK: home, setup e painel publicados e com assets carregando"
