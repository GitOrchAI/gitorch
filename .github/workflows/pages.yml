name: pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        working-directory: apps/web
        env:
          # Valores por VARIÁVEIS do repositório (Settings → Variables) — nada
          # de URL de infraestrutura fixa em código.
          NEXT_PUBLIC_API_URL: ${{ vars.GITORCH_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: pnpm build
      # Rigor 1: se há basePath, os assets do _next TÊM que estar prefixados com
      # ele. Sem isso o site quebra no GitHub Pages (assets 404). Falha o build
      # ANTES de publicar — foi exatamente o que quebrou o site em 06/07.
      - name: Assert basePath aplicado aos assets
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
        run: |
          BP="${NEXT_PUBLIC_BASE_PATH:-}"
          if [ -n "$BP" ]; then
            if grep -qE '(src|href)="/_next/' out/index.html; then
              echo "::error::Assets referenciados na RAIZ (/_next) apesar de basePath=$BP — o site quebraria (assets 404) no GitHub Pages."
              grep -oE '(src|href)="/_next[^"]*"' out/index.html | head -5
              exit 1
            fi
            if ! grep -qE "(src|href)=\"$BP/_next/" out/index.html; then
              echo "::error::Nenhum asset _next prefixado com $BP encontrado em out/index.html."
              exit 1
            fi
            echo "OK: assets prefixados com basePath $BP"
          else
            echo "Sem basePath (domínio raiz) — nada a checar."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      # Rigor 2 + auto-cura: a infra do Pages falha com "try again later" de vez
      # em quando. Até 3 tentativas automáticas para uma falha transitória NUNCA
      # deixar o site quebrado (foi o que derrubou o site 2x em 06/07).
      - id: d1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with: { timeout: 600000, error_count: 25 }
      - if: steps.d1.outcome == 'failure'
        run: echo "Deploy 1 falhou (transitório); tentando de novo em 20s" && sleep 20
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with: { timeout: 600000, error_count: 25 }
      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: echo "Deploy 2 falhou; última tentativa em 30s" && sleep 30
      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with: { timeout: 600000, error_count: 25 }
      # Se as 3 falharem, o job falha (e o smoke nem roda) — vai vermelho, não
      # verde-falso. Mas o esperado é uma das 3 passar e o site se curar sozinho.
  smoke:
    # Rigor 3: só passa se o site publicado E seus assets carregarem de verdade.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verifica site publicado + assets carregam
        run: |
          HOST="https://${{ github.repository_owner }}.github.io"
          BASE="$HOST${{ vars.GITORCH_PAGES_BASE_PATH }}/"
          echo "Testando $BASE"
          HTML=""
          for i in 1 2 3 4 5 6 7 8; do
            HTML=$(curl -fsSL "$BASE" 2>/dev/null) && [ -n "$HTML" ] && break
            echo "tentativa $i: aguardando propagação do CDN..."; sleep 15
          done
          if [ -z "$HTML" ]; then echo "::error::Site não respondeu em $BASE"; exit 1; fi
          ASSET=$(echo "$HTML" | grep -oE '/[A-Za-z0-9/_.-]*_next/static/[A-Za-z0-9/_.-]+\.(js|css)' | head -1)
          if [ -z "$ASSET" ]; then echo "::error::Nenhum asset _next referenciado no HTML."; exit 1; fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HOST$ASSET")
          echo "asset $ASSET -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Asset do site retornou $CODE — site publicado está QUEBRADO (basePath/assets)."
            exit 1
          fi
          echo "OK: site e assets carregam ($BASE)"
