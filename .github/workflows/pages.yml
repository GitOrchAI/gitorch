name: pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        working-directory: apps/web
        env:
          # Valores por VARIÁVEIS do repositório (Settings → Variables) — nada
          # de URL de infraestrutura fixa em código.
          NEXT_PUBLIC_API_URL: ${{ vars.GITORCH_PUBLIC_API_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
        run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
