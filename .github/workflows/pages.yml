name: pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
      NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
      NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - name: Build static site
        working-directory: apps/web
        run: pnpm build
      - name: Bypass Jekyll on GitHub Pages
        working-directory: apps/web
        run: touch out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out
      - name: Assert basePath nas páginas (home + setup + painel)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
        run: |
          BP="${NEXT_PUBLIC_BASE_PATH:-}"
          if [ "$BP" = "/" ]; then BP=""; fi
          if [ -z "$BP" ]; then echo "Sem basePath (domínio raiz) — nada a checar."; exit 0; fi
          for f in index.html setup/index.html painel/index.html; do
            [ -f "out/$f" ] || { echo "::error::out/$f não existe (página faltando no build)."; exit 1; }
            if grep -qE '(src|href)="/_next/' "out/$f"; then
              echo "::error::$f: assets na RAIZ (/_next) apesar de basePath=$BP — quebraria no Pages."
              grep -oE '(src|href)="/_next[^"]*"' "out/$f" | head -3
              exit 1
            fi
            if ! grep -qE "(src|href)=\"$BP/_next/" "out/$f"; then
              echo "::error::$f: nenhum asset _next prefixado com $BP."
              exit 1
            fi
            echo "OK: $f com assets em $BP"
          done
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Verifica páginas publicadas + assets (home + setup + painel)
        run: |
          HOST="https://${{ github.repository_owner }}.github.io"
          PREFIX="${{ vars.GITORCH_PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}"
          if [ "$PREFIX" = "/" ]; then PREFIX=""; fi
          fail=0
          for path in "/" "/setup" "/painel"; do
            if [ "$path" = "/" ]; then
              URL="$HOST$PREFIX/"
            else
              URL="$HOST$PREFIX$path/"
            fi
            HTML=""
            for i in 1 2 3 4 5 6 7 8; do
              HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
              if [ "$HTTP_CODE" = "200" ]; then
                HTML=$(curl -fsSL "$URL" 2>/dev/null)
                break
              fi
              echo "[$path] tentativa $i: HTTP $HTTP_CODE (aguardando CDN propagar)..."
              sleep 15
            done
            if [ -z "$HTML" ]; then echo "::error::$URL não respondeu 200 OK"; fail=1; continue; fi
            ASSET=$(echo "$HTML" | grep -oE '/[A-Za-z0-9/_.-]*_next/static/[A-Za-z0-9/_.-]+\.(js|css)' | head -1)
            if [ -z "$ASSET" ]; then echo "::error::$URL sem asset _next no HTML"; fail=1; continue; fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HOST$ASSET")
            echo "$path -> asset HTTP $CODE"
            if [ "$CODE" != "200" ]; then echo "::error::$URL: asset retornou $CODE (página quebrada)"; fail=1; fi
          done
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "OK: home, setup e painel publicados e com assets carregando"



