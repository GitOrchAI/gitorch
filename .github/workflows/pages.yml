name: pages

on:
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O composite da casa, o mesmo que ci.yml, e2e-wizard.yml e sla-tracker.yml
      # usam. Aqui havia `pnpm/action-setup@v4` com `version: 9` mais um
      # `setup-node` próprio, e era isso que derrubava o job no PASSO 2, em todo
      # run desde 11/09:
      #
      #   Error: Multiple versions of pnpm specified:
      #     - version 9 in the GitHub Action config with the key "version"
      #     - version pnpm@9.4.0 in the package.json with the key "packageManager"
      #
      # `.github/actions/setup-pnpm/action.yml` já explica por que `version:` não
      # entra: a versão do pnpm mora em UM lugar só (`packageManager`, na raiz).
      # O composite também traz o Node 22.x com `cache: pnpm` na ordem certa, que
      # é o que os dois passos removidos aqui faziam à mão.
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Build static site
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || '' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
      - name: Assert basePath nas páginas (home + setup + painel)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ vars.GITORCH_PAGES_BASE_PATH }}
        run: |
          BP="${NEXT_PUBLIC_BASE_PATH:-}"
          if [ -z "$BP" ]; then echo "Sem basePath (domínio raiz) — nada a checar."; exit 0; fi
          for f in index.html setup.html painel.html; do
            [ -f "out/$f" ] || { echo "::error::out/$f não existe (página faltando no build)."; exit 1; }
            if grep -qE '(src|href)="/_next/' "out/$f"; then
              echo "::error::$f: assets na RAIZ (/_next) apesar de basePath=$BP — quebraria no Pages."
              grep -oE '(src|href)="/_next[^"]*"' "out/$f" | head -3
              exit 1
            fi
            if ! grep -qE "(src|href)=\"$BP/_next/" "out/$f"; then
              echo "::error::$f: nenhum asset _next prefixado com $BP."
              exit 1
            fi
            echo "OK: $f com assets em $BP"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verifica páginas publicadas + assets (home + setup + painel)
        run: |
          HOST="https://${{ github.repository_owner }}.github.io"
          PREFIX="${{ vars.GITORCH_PAGES_BASE_PATH }}"
          fail=0
          for path in "/" "/setup" "/painel"; do
            URL="$HOST$PREFIX$path"
            HTML=""
            for i in 1 2 3 4 5 6 7 8; do
              HTML=$(curl -fsSL "$URL" 2>/dev/null) && [ -n "$HTML" ] && break
              echo "[$path] tentativa $i: aguardando CDN..."; sleep 15
            done
            if [ -z "$HTML" ]; then echo "::error::$URL não respondeu"; fail=1; continue; fi
            ASSET=$(echo "$HTML" | grep -oE '/[A-Za-z0-9/_.-]*_next/static/[A-Za-z0-9/_.-]+\.(js|css)' | head -1)
            if [ -z "$ASSET" ]; then echo "::error::$URL sem asset _next no HTML"; fail=1; continue; fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$HOST$ASSET")
            echo "$path -> asset HTTP $CODE"
            if [ "$CODE" != "200" ]; then echo "::error::$URL: asset retornou $CODE (página quebrada)"; fail=1; fi
          done
          if [ "$fail" != "0" ]; then exit 1; fi
          echo "OK: home, setup e painel publicados e com assets carregando"


