name: Security Alerts to Issues

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    # FASE 2: code scanning (CodeQL) e secret scanning ainda NÃO roteiam pro Jules.
    # Desligado de propósito até o pipeline do Dependabot estar redondo. Não apagar.
    if: false
    runs-on: ubuntu-latest
    permissions:
      issues: write
      security-events: read
    steps:
      - name: Fetch Alerts and Create Issues
        uses: actions/github-script@v7
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github-token: ${{ secrets.SECURITY_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Obter todas as issues existentes
            let existingIssues = [];
            let page = 1;
            while (true) {
              const response = await github.rest.issues.listForRepo({
                owner, repo, state: 'all', per_page: 100, page: page
              });
              if (response.data.length === 0) break;
              existingIssues = existingIssues.concat(response.data);
              page++;
            }

            const issueKeys = new Set();
            for (const issue of existingIssues) {
              const match = issue.body ? issue.body.match(/<!-- security-alert-id:\s*([a-zA-Z0-9_-]+)\s*-->/) : null;
              if (match) issueKeys.add(match[1]);
            }
            console.log(`Encontradas ${issueKeys.size} issues com marcadores de alertas de segurança existentes.`);

            // 2. Coletar alertas do Dependabot (TODOS os estados)
            let dependabotAlerts = [];
            try {
              const res = await github.rest.dependabot.listAlertsForRepo({ owner, repo, state: 'open' });
              dependabotAlerts = res.data;
              console.log(`Alertas do Dependabot abertos: ${dependabotAlerts.length}`);
            } catch (err) { console.error("Erro ao buscar alertas do Dependabot open:", err.message); }
            try {
              const res = await github.rest.dependabot.listAlertsForRepo({ owner, repo, state: 'fixed' });
              const fixedAlerts = res.data;
              console.log(`Alertas do Dependabot fixed: ${fixedAlerts.length}`);
              for (const alert of fixedAlerts) {
                const alertId = 'dependabot-' + alert.number;
                if (!issueKeys.has(alertId)) dependabotAlerts.push(alert);
              }
            } catch (err) { console.error("Erro ao buscar alertas do Dependabot fixed:", err.message); }
            try {
              const res = await github.rest.dependabot.listAlertsForRepo({ owner, repo, state: 'dismissed' });
              const dismissedAlerts = res.data;
              console.log(`Alertas do Dependabot dismissed: ${dismissedAlerts.length}`);
              for (const alert of dismissedAlerts) {
                const alertId = 'dependabot-' + alert.number;
                if (!issueKeys.has(alertId)) dependabotAlerts.push(alert);
              }
            } catch (err) { console.error("Erro ao buscar alertas do Dependabot dismissed:", err.message); }

            // 3. Coletar alertas do Code Scanning (TODOS os estados)
            let codeScanningAlerts = [];
            try {
              const res = await github.rest.codeScanning.listAlertsForRepo({ owner, repo, state: 'open' });
              codeScanningAlerts = res.data;
              console.log(`Alertas de Code Scanning abertos: ${codeScanningAlerts.length}`);
            } catch (err) { console.error("Erro ao buscar Code Scanning open:", err.message); }
            try {
              const res = await github.rest.codeScanning.listAlertsForRepo({ owner, repo, state: 'fixed' });
              const fixedAlerts = res.data;
              console.log(`Alertas de Code Scanning fixed: ${fixedAlerts.length}`);
              for (const alert of fixedAlerts) {
                const alertId = 'codescanning-' + alert.number;
                if (!issueKeys.has(alertId)) codeScanningAlerts.push(alert);
              }
            } catch (err) { console.error("Erro ao buscar Code Scanning fixed:", err.message); }

            // 4. Coletar alertas do Secret Scanning (TODOS os estados)
            let secretScanningAlerts = [];
            try {
              const res = await github.rest.secretScanning.listAlertsForRepo({ owner, repo, state: 'open' });
              secretScanningAlerts = res.data;
              console.log(`Alertas de Secret Scanning abertos: ${secretScanningAlerts.length}`);
            } catch (err) { console.error("Erro ao buscar Secret Scanning open:", err.message); }
            try {
              const res = await github.rest.secretScanning.listAlertsForRepo({ owner, repo, state: 'resolved' });
              const resolvedAlerts = res.data;
              console.log(`Alertas de Secret Scanning resolved: ${resolvedAlerts.length}`);
              for (const alert of resolvedAlerts) {
                const alertId = 'secretscanning-' + alert.number;
                if (!issueKeys.has(alertId)) secretScanningAlerts.push(alert);
              }
            } catch (err) { console.error("Erro ao buscar Secret Scanning resolved:", err.message); }

            // Helpers de formatação
            function formatCVSS(cvss) { if (!cvss) return 'N/A'; const p = []; if (cvss.score !== undefined) p.push(`Score: ${cvss.score}`); if (cvss.vector_string) p.push(`Vector: \`${cvss.vector_string}\``); return p.join(' | '); }
            function formatCVSSAll(cvssSeverities) { if (!cvssSeverities) return 'N/A'; const l = []; if (cvssSeverities.cvss_v3) l.push(`**CVSS v3.1:** ${formatCVSS(cvssSeverities.cvss_v3)}`); if (cvssSeverities.cvss_v4) l.push(`**CVSS v4.0:** ${formatCVSS(cvssSeverities.cvss_v4)}`); return l.length ? l.join('\n') : 'N/A'; }
            function formatCWEs(cwes) { if (!cwes || !Array.isArray(cwes) || !cwes.length) return 'Nenhum CWE associado'; return cwes.map(c => `- **CWE-${c.cwe_id}**: ${c.name}`).join('\n'); }
            function formatVulnVersions(vulns) { if (!vulns || !Array.isArray(vulns) || !vulns.length) return 'N/A'; return vulns.map(v => { const patched = v.first_patched_version?.identifier ? `→ Corrigido em **${v.first_patched_version.identifier}**` : ''; return `- **${v.package.name}** (${v.package.ecosystem}): \`${v.vulnerable_version_range}\` ${patched} [${v.severity}]`; }).join('\n'); }
            function formatEPSS(epss) { if (!epss) return 'N/A'; return `**Prob. exploração:** ${(epss.percentage * 100).toFixed(4)}% (Percentil: ${(epss.percentile * 100).toFixed(2)}%)`; }
            function formatReferences(refs) { if (!refs || !Array.isArray(refs) || !refs.length) return 'Nenhuma referência'; return refs.map(r => `- [${r.url}](${r.url})`).join('\n'); }

            // Descrição rica SEM LLM (fallback completo)
            function generateRichDescription(alertType, alertDetails) {
              const adv = alertDetails.security_advisory || {};
              const dep = alertDetails.dependency || {};
              const pkg = dep.package || {};
              let md = `## 🐞 Issue de Segurança: ${alertType}\n\n`;
              md += `### Cabeçalho Técnico\n\n| Campo | Valor |\n|-------|-------|\n`;
              md += `| **Pacote Afetado** | \`${pkg.name || 'Não informado'}\` |\n`;
              md += `| **Ecosistema** | ${pkg.ecosystem || 'Não informado'} |\n`;
              md += `| **Arquivo de Manifesto** | \`${dep.manifest_path || 'Não informado'}\` |\n`;
              md += `| **Relacionamento** | ${dep.relationship || 'Não informado'} |\n`;
              md += `| **Escopo** | ${dep.scope || 'Não informado'} |\n`;
              md += `| **Alerta Dependabot** | #${alertDetails.number || 'N/A'} |\n`;
              md += `| **CVE ID** | ${adv.cve_id || 'N/A'} |\n`;
              md += `| **GHSA ID** | ${adv.ghsa_id || 'N/A'} |\n`;
              md += `| **Severidade** | ${adv.severity || 'Desconhecida'} |\n`;
              md += `| **Classificação** | ${adv.classification || 'Não informado'} |\n`;
              md += `| **Estado** | ${alertDetails.state || 'open'} |\n`;
              md += `| **Publicado em** | ${adv.published_at || 'Não informado'} |\n`;
              md += `| **Atualizado em** | ${adv.updated_at || 'Não informado'} |\n\n`;
              md += `### Métricas de Severidade\n\n${formatCVSSAll(adv.cvss_severities)}\n\n`;
              md += `### CWEs Associados\n\n${formatCWEs(adv.cwes)}\n\n`;
              md += `### EPSS\n\n${formatEPSS(adv.epss)}\n\n`;
              md += `### Versões Vulneráveis e Correção\n\n${formatVulnVersions(adv.vulnerabilities)}\n\n`;
              md += `### 1. Resumo (Negócio)\n\n${adv.summary || 'Não informado'}\n\n`;
              md += `### 2. Descrição Técnica\n\n${adv.description ? adv.description.substring(0, 5000) : 'Não informada'}\n\n`;
              md += `### 3. Impacto de Segurança\n\n| Categoria | Classificação | Detalhamento |\n| :--- | :--- | :--- |\n| **STRIDE** | Baseado na vulnerabilidade | Análise pendente |\n| **OWASP Top 10** | Baseado na vulnerabilidade | Análise pendente |\n\n**Cenários:**\n1. Análise pendente\n2. Análise pendente\n\n`;
              md += `### 4. Plano de Mitigação\n\n#### Opção A: Atualização Direta\n\n`;
              if (adv.vulnerabilities && adv.vulnerabilities.length > 0) {
                const fv = adv.vulnerabilities[0];
                if (fv.first_patched_version?.identifier) {
                  md += `1. Atualize \`${pkg.name}\` para **${fv.first_patched_version.identifier}**+:\n\`\`\`bash\npnpm add ${pkg.name}@${fv.first_patched_version.identifier}\n\`\`\`\n\n`;
                  md += `2. Valide:\n\`\`\`bash\npnpm install --frozen-lockfile\n\`\`\`\n\n`;
                }
              }
              md += `#### Opção B: Workaround\n\nIsolamento do componente se atualização impossível.\n\n`;
              md += `### 5. Comandos de Solução\n\n\`\`\`bash\npnpm list ${pkg.name}\npnpm add ${pkg.name}@latest\npnpm audit\n\`\`\`\n\n`;
              md += `### 6. Referências\n\n${formatReferences(adv.references)}\n\n---\n<!-- security-alert-id: ${alertType.toLowerCase().replace(/\s+/g, '-')}-${alertDetails.number} -->`;
              return md;
            }

            // Enriquecimento via OpenRouter
            async function enrichWithOpenRouter(alertType, alertDetails) {
              const key = process.env.OPENROUTER_API_KEY;
              if (!key) return generateRichDescription(alertType, alertDetails);

              const adv = alertDetails.security_advisory || {};
              const dep = alertDetails.dependency || {};
              const pkg = dep.package || {};

              const prompt = "Voce e engenheiro de seguranca senior. Crie issue EXTREMAMENTE DETALHADA em PT-BR para alerta " + alertType + ". Use TODOS estes dados reais: " + JSON.stringify(alertDetails, null, 2) + ". REGRAS: 1) Preencha TODAS secoes do template com dados REAIS. 2) NAO deixe campos vazios. 3) Use Markdown pro (tabelas, listas, codigo). 4) Seja especifico: versos exatas, CVEs, CWEs, CVSS. TEMPLATE OBRIGATORIO: --- ## 🐞 Issue: " + alertType + " ### Cabeçalho | Campo | Valor | |---|---| | Pacote | " + (pkg.name || 'N/A') + " | | Eco | " + (pkg.ecosystem || 'N/A') + " | | Manifest | " + (dep.manifest_path || 'N/A') + " | | Alert # | " + (alertDetails.number || 'N/A') + " | | CVE | " + (adv.cve_id || 'N/A') + " | | GHSA | " + (adv.ghsa_id || 'N/A') + " | | Severidade | " + (adv.severity || 'N/A') + " | | Estado | " + (alertDetails.state || 'open') + " | ### Metricas " + formatCVSSAll(adv.cvss_severities) + " ### CWEs " + formatCWEs(adv.cwes) + " ### EPSS " + formatEPSS(adv.epss) + " ### Versoes " + formatVulnVersions(adv.vulnerabilities) + " ### 1. Resumo " + (adv.summary || 'N/A') + " ### 2. Desc Tecn " + (adv.description ? adv.description.substring(0,3000) : 'N/A') + " ### 3. Impacto STRIDE/OWASP/Cenarios ### 4. Mitigacao (A: update direto com comandos pnpm exatos; B: workaround) ### 5. Codigos/Comandos ### 6. Refs " + formatReferences(adv.references) + " --- <!-- security-alert-id: " + alertType.toLowerCase().replace(/\s+/g, '-') + "-" + alertDetails.number + " -->";

              try {
                const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST', headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'HTTP-Referer': 'https://github.com/loureng/gitorch' },
                  body: JSON.stringify({ model: 'openrouter/free', messages: [{ role: 'user', content: prompt }], max_tokens: 8000, temperature: 0.1 })
                });
                if (!resp.ok) throw new Error('OpenRouter ' + resp.status);
                const data = await resp.json();
                return data.choices[0].message.content;
              } catch (e) { console.error("Falha OpenRouter:", e.message); return generateRichDescription(alertType, alertDetails); }
            }

            // Processar Dependabot
            for (const alert of dependabotAlerts) {
              const alertId = 'dependabot-' + alert.number;
              if (issueKeys.has(alertId)) { console.log('Issue Dependabot #' + alert.number + ' existe. Pulando.'); continue; }
              console.log('Processando Dependabot #' + alert.number + '...');
              const details = { number: alert.number, state: alert.state, dependency: alert.dependency, security_advisory: alert.security_advisory };
              const body = await enrichWithOpenRouter('Dependabot Alert', details);
              const title = '[Segurança] Dependabot: Vulnerabilidade em ' + (alert.dependency?.package?.name || 'pkg') + ' (' + (alert.security_advisory?.severity || 'unknown') + ')';
              await github.rest.issues.create({ owner, repo, title, body, labels: ['jules', 'dependabot', 'security', alert.security_advisory?.severity || 'unknown'] });
              console.log('Issue criada Dependabot #' + alert.number);
              await new Promise(r => setTimeout(r, 1000));
            }

            // Processar Code Scanning
            for (const alert of codeScanningAlerts) {
              const alertId = 'codescanning-' + alert.number;
              if (issueKeys.has(alertId)) { console.log('Issue CodeQL #' + alert.number + ' existe.'); continue; }
              console.log('Processando CodeQL #' + alert.number + '...');
              const details = { number: alert.number, rule_id: alert.rule.id, severity: alert.rule.security_severity_level, description: alert.rule.description, tool: alert.tool.name, file_path: alert.most_recent_instance?.location?.path, start_line: alert.most_recent_instance?.location?.start_line, end_line: alert.most_recent_instance?.location?.end_line, message: alert.most_recent_instance?.message?.text, full_description: alert.rule.full_description, tags: alert.rule.tags, html_url: alert.html_url };
              const body = await enrichWithOpenRouter('Code Scanning Alert', details);
              const title = '[Segurança] CodeQL: ' + (alert.rule.description || alert.rule.id) + ' (' + alert.rule.security_severity_level + ')';
              await github.rest.issues.create({ owner, repo, title, body, labels: ['jules', 'codeql', 'security', alert.rule.security_severity_level] });
              console.log('Issue CodeQL #' + alert.number);
              await new Promise(r => setTimeout(r, 1000));
            }

            // Processar Secret Scanning
            for (const alert of secretScanningAlerts) {
              const alertId = 'secretscanning-' + alert.number;
              if (issueKeys.has(alertId)) { console.log('Issue Secret #' + alert.number + ' existe.'); continue; }
              console.log('Processando Secret #' + alert.number + '...');
              const details = { number: alert.number, secret_type: alert.secret_type, secret_type_display_name: alert.secret_type_display_name, created_at: alert.created_at, resolved: alert.resolved, html_url: alert.html_url };
              const body = await enrichWithOpenRouter('Secret Scanning Alert', details);
              const title = '[Segurança] Secret Leak: ' + alert.secret_type_display_name + ' detectado';
              await github.rest.issues.create({ owner, repo, title, body, labels: ['jules', 'secret-scanning', 'security', 'critical'] });
              console.log('Issue Secret #' + alert.number);
              await new Promise(r => setTimeout(r, 1000));
            }