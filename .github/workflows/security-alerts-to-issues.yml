name: Security Alerts to Issues

on:
  schedule:
    - cron: '0 6 * * *' # Roda às 06:00 UTC diariamente (03:00 Horário de Brasília)
  workflow_dispatch: # Permite disparo manual imediato

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      security-events: read
    steps:
      - name: Fetch Alerts and Create Issues
        uses: actions/github-script@v9
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github-token: ${{ secrets.SECURITY_PAT }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Obter todas as issues existentes (abertas e fechadas) do repo para evitar duplicados
            let existingIssues = [];
            let page = 1;
            while (true) {
              const response = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'all',
                per_page: 100,
                page: page
              });
              if (response.data.length === 0) break;
              existingIssues = existingIssues.concat(response.data);
              page++;
            }

            const issueKeys = new Set();
            for (const issue of existingIssues) {
              const match = issue.body ? issue.body.match(/<!-- security-alert-id:\s*([a-zA-Z0-9_-]+)\s*-->/) : null;
              if (match) {
                issueKeys.add(match[1]);
              }
            }

            console.log(`Encontradas ${issueKeys.size} issues com marcadores de alertas de segurança existentes.`);

            // 2. Coletar alertas do Dependabot
            let dependabotAlerts = [];
            try {
              const res = await github.rest.dependabot.listAlertsForRepo({
                owner,
                repo,
                state: 'open'
              });
              dependabotAlerts = res.data;
              console.log(`Alertas do Dependabot abertos: ${dependabotAlerts.length}`);
            } catch (err) {
              console.error("Erro ao buscar alertas do Dependabot:", err.message);
            }

            // 3. Coletar alertas do Code Scanning
            let codeScanningAlerts = [];
            try {
              const res = await github.rest.codeScanning.listAlertsForRepo({
                owner,
                repo,
                state: 'open'
              });
              codeScanningAlerts = res.data;
              console.log(`Alertas de Code Scanning abertos: ${codeScanningAlerts.length}`);
            } catch (err) {
              console.error("Erro ao buscar alertas de Code Scanning:", err.message);
            }

            // 4. Coletar alertas do Secret Scanning
            let secretScanningAlerts = [];
            try {
              const res = await github.rest.secretScanning.listAlertsForRepo({
                owner,
                repo,
                state: 'open'
              });
              secretScanningAlerts = res.data;
              console.log(`Alertas de Secret Scanning abertos: ${secretScanningAlerts.length}`);
            } catch (err) {
              console.error("Erro ao buscar alertas de Secret Scanning:", err.message);
            }

            // Função para enriquecer a descrição da issue usando o OpenRouter
            async function enrichWithOpenRouter(alertType, alertDetails) {
              const openRouterKey = process.env.OPENROUTER_API_KEY;
              if (!openRouterKey) {
                console.log("OPENROUTER_API_KEY não configurada. Usando descrição padrão.");
                return `Alerta de segurança detectado: ${JSON.stringify(alertDetails, null, 2)}`;
              }

              const prompt = `Você é um engenheiro de segurança sênior. Crie uma issue rica e detalhada em Português (PT-BR) para corrigir o seguinte alerta de segurança do tipo "${alertType}".
            Você DEVE OBRIGATORIAMENTE seguir o template Markdown abaixo, preenchendo as seções de forma muito detalhada e profissional. NÃO adicione nenhum texto de introdução ou conclusão fora do Markdown.

            Use estes dados para preencher o cabeçalho:
            - Nome da vulnerabilidade: ${alertDetails.summary || 'Vulnerabilidade em ' + alertDetails.package}
            - Pacote Afetado: \`${alertDetails.package || ''}\`
            - Arquivo de Manifesto: \`${alertDetails.manifest || ''}\`
            - Alerta Dependabot: #${alertDetails.number || ''}
            - CVE ID: ${alertDetails.cve || 'N/A'}
            - Severidade: ${alertDetails.severity || 'Desconhecida'}

            Template do Corpo da Issue:
            ---
            ## 🐞 Issue de Segurança: ${alertDetails.summary || 'Vulnerabilidade em ' + alertDetails.package} no pacote \`${alertDetails.package || ''}\` (${alertDetails.cve || 'N/A'})

            **Severidade:** ${alertDetails.severity === 'high' ? '🔴 Alta (High)' : alertDetails.severity === 'critical' ? '🚨 Crítica (Critical)' : alertDetails.severity === 'medium' ? '🟡 Média (Medium)' : '🟢 Baixa (Low)'}
            **Pacote Afetado:** \`${alertDetails.package || ''}\`
            **Arquivo de Manifesto:** \`${alertDetails.manifest || ''}\`
            **Alerta Dependabot:** #${alertDetails.number || ''}
            **CVE:** [${alertDetails.cve || 'N/A'}](https://cve.mitre.org/cgi-bin/cvename.cgi?name=${alertDetails.cve || ''})

            ---

            ### 1. Resumo do Problema (Visão de Negócio)
            [Explicação curta e clara do problema em linguagem de negócios, explicando brevemente termos complexos de forma didática]

            ### 2. Impacto Potencial de Segurança
            | Categoria | Classificação | Detalhamento |
            | :--- | :--- | :--- |
            | **STRIDE** | [Categorias STRIDE afetadas, ex: T (Tampering) & E (Elevation of Privilege)] | [Detalhamento do risco com base em STRIDE] |
            | **OWASP Top 10** | [Categoria OWASP, ex: A01:2021 – Broken Access Control] | [Detalhamento do risco com base em OWASP] |

            **Cenários de Ataque Realistas:**
            1. [Cenário de ataque realista 1, ex: exploração via fluxo de upload ou pipeline de CI/CD]
            2. [Cenário de ataque realista 2]

            ---

            ### 3. Plano de Mitigação e Resolução (Passo a Passo)
            #### Opção A: Atualização Direta (Recomendada)
            [Passo a passo detalhado incluindo comandos de pnpm/npm e validação da árvore de dependências no lockfile]

            #### Opção B: Mitigação Temporária (Workaround)
            [Passos alternativos como isolamento, restrição de permissão ou sanitização se atualização imediata for impossível]

            ---

            ### 4. Exemplos de Código e Comandos para Solução
            [Comandos pnpm/npm de atualização, overrides no package.json se relevante, e script/código de exemplo em JS/TS para validação local da vulnerabilidade]

            ---

            ### 5. Referências
            * [Link para Advisory do GitHub se disponível ou genérico]
            * [Link para CVE Details]
            * [Link para Changelog do pacote ou repositório]
            ---

            Detalhes adicionais do alerta para guiar o preenchimento:
            ${JSON.stringify(alertDetails, null, 2)}`;

              try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${openRouterKey}`,
                    'Content-Type': 'application/json',
                    'HTTP-Referer': 'https://github.com/loureng/gitorch',
                  },
                  body: JSON.stringify({
                    model: 'openrouter/free',
                    messages: [{ role: 'user', content: prompt }]
                  })
                });

                if (!response.ok) {
                  const errText = await response.text();
                  throw new Error(`OpenRouter API error: ${response.status} - ${errText}`);
                }

                const data = await response.json();
                return data.choices[0].message.content;
              } catch (err) {
                console.error("Falha ao chamar OpenRouter:", err.message);
                return `Falha ao gerar descrição detalhada com IA. Detalhes originais do alerta:\n\n\`\`\`json\n${JSON.stringify(alertDetails, null, 2)}\n\`\`\``;
              }
            }

            // Processar Dependabot Alerts
            for (const alert of dependabotAlerts) {
              const alertId = `dependabot-${alert.number}`;
              if (issueKeys.has(alertId)) {
                console.log(`Issue para Dependabot alerta #${alert.number} já existe. Pulando.`);
                continue;
              }

              console.log(`Processando Dependabot alerta #${alert.number}...`);
              const alertDetails = {
                number: alert.number,
                package: alert.dependency.package.name,
                manifest: alert.dependency.manifest_path,
                severity: alert.security_advisory.severity,
                summary: alert.security_advisory.summary,
                description: alert.security_advisory.description,
                cve: alert.security_advisory.cve_id,
                cvss: alert.security_advisory.cvss
              };

              const richDescription = await enrichWithOpenRouter('Dependabot Alert', alertDetails);
              
              const issueBody = `${richDescription}\n\n<!-- security-alert-id: ${alertId} -->`;
              const issueTitle = `[Segurança] Dependabot: Vulnerabilidade em ${alert.dependency.package.name} (${alert.security_advisory.severity})`;

              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: issueBody,
                labels: ['jules', 'dependabot']
              });
              console.log(`Issue criada para Dependabot alerta #${alert.number}`);
              // Pequena pausa para evitar rate limit do OpenRouter
              await new Promise(r => setTimeout(r, 1000));
            }

            // Processar Code Scanning Alerts
            for (const alert of codeScanningAlerts) {
              const alertId = `codescanning-${alert.number}`;
              if (issueKeys.has(alertId)) {
                console.log(`Issue para Code Scanning alerta #${alert.number} já existe. Pulando.`);
                continue;
              }

              console.log(`Processando Code Scanning alerta #${alert.number}...`);
              const alertDetails = {
                number: alert.number,
                rule_id: alert.rule.id,
                severity: alert.rule.security_severity_level,
                description: alert.rule.description,
                tool: alert.tool.name,
                file_path: alert.most_recent_instance?.location?.path,
                start_line: alert.most_recent_instance?.location?.start_line,
                message: alert.most_recent_instance?.message?.text
              };

              const richDescription = await enrichWithOpenRouter('Code Scanning Alert', alertDetails);
              
              const issueBody = `${richDescription}\n\n<!-- security-alert-id: ${alertId} -->`;
              const issueTitle = `[Segurança] CodeQL: ${alert.rule.description || alert.rule.id} (${alert.rule.security_severity_level})`;

              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: issueBody,
                labels: ['jules', 'dependabot']
              });
              console.log(`Issue criada para Code Scanning alerta #${alert.number}`);
              await new Promise(r => setTimeout(r, 1000));
            }

            // Processar Secret Scanning Alerts
            for (const alert of secretScanningAlerts) {
              const alertId = `secretscanning-${alert.number}`;
              if (issueKeys.has(alertId)) {
                console.log(`Issue para Secret Scanning alerta #${alert.number} já existe. Pulando.`);
                continue;
              }

              console.log(`Processando Secret Scanning alerta #${alert.number}...`);
              const alertDetails = {
                number: alert.number,
                secret_type: alert.secret_type,
                secret_type_display_name: alert.secret_type_display_name,
                created_at: alert.created_at
              };

              const richDescription = await enrichWithOpenRouter('Secret Scanning Alert', alertDetails);
              
              const issueBody = `${richDescription}\n\n<!-- security-alert-id: ${alertId} -->`;
              const issueTitle = `[Segurança] Secret Leak: ${alert.secret_type_display_name} detectado`;

              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: issueBody,
                labels: ['jules', 'dependabot']
              });
              console.log(`Issue criada para Secret Scanning alerta #${alert.number}`);
              await new Promise(r => setTimeout(r, 1000));
            }
