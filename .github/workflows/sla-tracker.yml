name: SLA Tracker for Dependabot Alerts

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  security-events: read
  issues: write

jobs:
  track-sla:
    name: Track SLA & Alert on Breaches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SECURITY_PAT }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: .github/scripts
        run: bun install

      - name: Run SLA Tracker
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SLA_BUSINESS_DAYS: ${{ env.SLA_BUSINESS_DAYS || '1' }}
        run: |
          echo "Running SLA tracker for Dependabot alerts..."
          bun run sla-tracker.ts "${{ env.SLA_BUSINESS_DAYS }}"
        working-directory: .github/scripts