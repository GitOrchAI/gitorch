name: SLA Tracker for Dependabot Alerts

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  security-events: read
  issues: write

jobs:
  track-sla:
    name: Track SLA & Alert on Breaches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECURITY_PAT || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.4.0

      - name: Setup Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '22'
          check-latest: false

      - name: Install Dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run SLA Tracker
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SLA_BUSINESS_DAYS: ${{ env.SLA_BUSINESS_DAYS || '1' }}
        run: |
          echo "Running SLA tracker for Dependabot alerts..."
          npx tsx sla-tracker.ts "$SLA_BUSINESS_DAYS"
        working-directory: .github/scripts
