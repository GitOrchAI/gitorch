name: SLA Tracker for Dependabot Alerts

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

permissions:
  security-events: read
  issues: write

jobs:
  track-sla:
    name: Track SLA & Alert on Breaches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SECURITY_PAT || github.token }}

      - name: Setup Node (pnpm)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` e não `install`: instala exatamente o que está no lockfile
      # versionado. Este passo roda no mesmo trabalho que recebe o token de
      # segurança, então resolver dependência do registry na hora — sem pin —
      # deixaria qualquer versão nova de dependência transitiva entrar sem
      # revisão, ao alcance desse token. O runtime também deixa de ser um
      # detalhe: os outros robôs desta automação já rodam em Node com o mesmo
      # lockfile, e era este o único fora do padrão.
      - name: Install Dependencies
        working-directory: .github/scripts
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Run SLA Tracker
        env:
          SECURITY_PAT: ${{ secrets.SECURITY_PAT || github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          SLA_BUSINESS_DAYS: ${{ env.SLA_BUSINESS_DAYS || '1' }}
        run: |
          echo "Running SLA tracker for Dependabot alerts..."
          npx tsx sla-tracker.ts "$SLA_BUSINESS_DAYS"
        working-directory: .github/scripts
