name: Sincronizar Atualizações na Wiki Pública

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar pnpm e Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Instalar Dependências
        run: pnpm install --no-frozen-lockfile

      - name: Sincronizar Logs e Atualizações na Wiki
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPERMEMORY_API_KEY: ${{ secrets.SUPERMEMORY_API_KEY }}
        run: |
          # 1. Clonar a Wiki do repositório
          git clone "https://x-access-token:${{ secrets.SECURITY_PAT || github.token }}@github.com/${{ github.repository }}.wiki.git" wiki_temp
          
          # 2. Executar o gerador de patch notes em TypeScript (escreve em wiki_temp)
          pnpm exec tsx scripts/ci/generate-patch-notes.ts
          
          # 3. Executar a sincronização de documentação com DLP (escreve em wiki_temp)
          pnpm exec tsx scripts/ci/sync-wiki.ts
          
          # 4. Enviar memórias geradas para o Supermemory via API REST
          pnpm exec tsx scripts/ci/sync-supermemory.ts
          
          # 5. Configurar Git na pasta temporária da Wiki e fazer push
          cd wiki_temp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update wiki docs & patch notes" && git push origin)


