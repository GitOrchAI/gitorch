name: Sincronizar Atualizações na Wiki Pública

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar Dependências
        run: pnpm install --no-frozen-lockfile

      - name: Sincronizar Logs e Atualizações na Wiki
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # 1. Clonar a Wiki do repositório
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki_temp
          
          # 2. Executar o gerador de patch notes em TypeScript
          pnpm exec tsx scripts/ci/generate-patch-notes.ts
          
          # 3. Copiar os READMEs traduzidos para a Wiki
          cd wiki_temp
          
          # Configurar Git na pasta temporária da Wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          cp ../README.md Home.md
          cp ../README.pt-br.md Home-PT-BR.md
          cp ../README.es.md Home-ES.md
          
          # 4. Ajustar os links de arquivos para navegação de páginas da Wiki
          # Home (English)
          sed -i 's/README.pt-br.md/Home-PT-BR/g' Home.md
          sed -i 's/README.es.md/Home-ES/g' Home.md
          
          # Home PT-BR
          sed -i 's/README.md/Home/g' Home-PT-BR.md
          sed -i 's/README.es.md/Home-ES/g' Home-PT-BR.md
          
          # Home ES
          sed -i 's/README.md/Home/g' Home-ES.md
          sed -i 's/README.pt-br.md/Home-PT-BR/g' Home-ES.md
          
          # 5. Adicionar link para a respectiva página de atualizações recentes no rodapé
          # English
          echo "" >> Home.md
          echo "---" >> Home.md
          echo "📢 _[Latest Updates](Latest-Updates)_" >> Home.md
          
          # Português
          echo "" >> Home-PT-BR.md
          echo "---" >> Home-PT-BR.md
          echo "📢 _[Últimas Atualizações](Ultimas-Atualizacoes)_" >> Home-PT-BR.md
          
          # Español
          echo "" >> Home-ES.md
          echo "---" >> Home-ES.md
          echo "📢 _[Últimas Actualizaciones](Ultimas-Actualizaciones)_" >> Home-ES.md
          
          # 6. Commit e push de volta na Wiki
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update wiki patch notes and homepages" && git push origin)

