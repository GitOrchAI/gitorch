# Drop-in do serviço gitorch-control-plane.service — aplica o ledger de
# migração ANTES de subir o processo.
#
# INCIDENTE DE 26/08/2026: o PR #267 trouxe uma coluna nova no schema E o SQL
# no ledger, mas o deploy (manual: git pull, pnpm install, build, restart) não
# rodava scripts/db-migrate.sh — ninguém lembrava, e não havia nada que
# lembrasse por quem esquecesse. O processo subiu com o código pedindo uma
# coluna que o banco não tinha, e o scheduler ficou 80 minutos estourando
# P2022 a cada tique antes de alguém notar e rodar a migração na mão.
#
# scripts/db-migrate.sh já é IDEMPOTENTE por desenho (ver o comentário no
# topo do próprio script: "seguro pra rodar em todo deploy ANTES do switch de
# tráfego") — só faltava alguém chamá-lo sempre. `ExecStartPre` é o único
# lugar que não depende de ninguém lembrar: roda em TODO start do serviço —
# deploy manual, reboot da VM, ou o `Restart=always` depois de uma queda — e,
# se falhar, o systemd recusa subir o processo (comportamento padrão, sem
# flag extra), em vez de repetir o defeito de 26/08 (subir calado com o
# código à frente do banco).
#
# INSTALAÇÃO (por host — caminho abaixo é o da VM ARM de produção/dev):
#   sudo cp scripts/ops/gitorch-control-plane-migrate.conf \
#     /etc/systemd/system/gitorch-control-plane.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart gitorch-control-plane
#
# Ajuste o WorkingDirectory do serviço base se o checkout do seu host não for
# /home/ubuntu/projects/gitorch/apps/control-plane — este ExecStartPre roda
# com o MESMO WorkingDirectory da unit base (systemd aplica a mesma
# WorkingDirectory a todo Exec* da unit), então um caminho relativo já basta.
[Service]
ExecStartPre=/usr/bin/bash scripts/db-migrate.sh
